name: lint

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  # Pull-Request-Läufe über die PR-Nummer gruppieren (eindeutig, auch bei Forks),
  # Läufe auf main über den Ref-Namen.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}
  # Auf main nichts abbrechen: schnelle Merge-Folgen würden sonst laufende
  # Checks abschießen und die Historie des Default-Branch verfälschen.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ruff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: ruff installieren
        # Version steht ausschließlich in requirements.txt, damit CI und
        # Entwicklungsumgebung nicht auseinanderlaufen.
        run: pip install -r requirements.txt
      - name: ruff check
        run: ruff check --output-format=github .
      - name: ruff format --check
        run: ruff format --check .

  diagramme:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v4
        # Puppeteer lädt beim ersten npx-Lauf ein Chromium; der Schlüssel
        # folgt der in scripts/diagramme.sh gepinnten mermaid-cli-Version.
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-mermaid-cli-11.16.0
      - name: Unprivilegierte User-Namespaces freigeben
        # Ubuntu-24.04-Runner sperren sie per AppArmor, dann startet das
        # Chromium von puppeteer nicht ("No usable sandbox"). Freigeben
        # statt --no-sandbox, so bleibt die Chromium-Sandbox aktiv.
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: SVGs aus den Mermaid-Quellen rendern
        run: ./scripts/diagramme.sh
      - name: Gerendertes gegen den Commit abgleichen
        # Schlägt fehl, wenn eine .mmd geändert wurde, ohne
        # scripts/diagramme.sh laufen zu lassen und die SVGs mitzucommitten.
        run: git diff --exit-code docs/diagramme
