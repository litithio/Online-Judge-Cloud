# Wie in der GridFlex-Übung. Die Nodes entstehen bei jedem Frisch-Deployment
# neu und bekommen neue Hostkeys, teils auf wiederverwendeten Adressen; mit
# Prüfung würde jeder Neuaufbau an alten known_hosts-Einträgen scheitern.
# Wird wirksam, wenn ansible-playbook aus diesem Verzeichnis läuft.
[defaults]
host_key_checking = False

# Ohne Keepalive wartet ssh unbegrenzt auf einer tot gegangenen Verbindung,
# ein laufender Modulaufruf hängt dann für immer statt fehlzuschlagen. Mit
# den beiden ServerAlive-Optionen bricht ssh nach 45 Sekunden Funkstille ab
# und die betroffene Task schlägt sichtbar fehl. Die ersten drei Optionen sind
# die Vorgabe von Ansible, ssh_args ersetzt die Vorgabe statt sie zu ergänzen.
[ssh_connection]
ssh_args = -C -o ControlMaster=auto -o ControlPersist=60s -o ServerAliveInterval=15 -o ServerAliveCountMax=3
