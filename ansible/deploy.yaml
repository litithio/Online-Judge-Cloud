# Bringt den k3s-Cluster auf die Nodes aus dem Terraform-Inventory. Aufruf:
#
#   ansible-galaxy install -r requirements.yml
#   ansible-playbook -i inventory/generated-inventory.yml -i dns-credentials.yaml deploy.yaml
#
# VPN dabei aus: die Nodes sind über ihr öffentliches IPv6 erreichbar, der
# Full-Tunnel würde genau das kappen.
---
- name: Auf SSH und cloud-init warten
  hosts: all
  gather_facts: false
  tasks:
    - name: Warten, bis die Nodes bereit sind
      ansible.builtin.import_tasks: tasks/wait.yaml

# Die Rolle erkennt Server und Agents an k3s_role aus dem Inventory und
# richtet DNS und TLS über die Zone aus dns-credentials.yaml ein.
- name: K3s-Cluster ausrollen
  hosts: all
  tags: [k3s]
  become: true
  roles:
    # Die Rolle stellt external-dns auf v0.19.0. Dort beendet ein einzelner
    # fehlgeschlagener AXFR den Prozess und der Pod startet neu, siehe
    # kubernetes-sigs/external-dns#6219. Ab v0.21.0 gilt der Fehler als weich.
    # Damit fällt der Neustart als Warnsignal weg: ein anhaltender Ausfall
    # hinterlässt dann einen laufenden Pod, der still nichts mehr abgleicht.
    - role: k3s-dhbw-cloud-role
      vars:
        external_dns_version: "v0.21.0"

# Nur auf den Agents, der Server führt keine Einreichungen aus.
- name: Sandbox-Laufzeit gVisor auf den Judge-Nodes einrichten
  hosts: judge_k3s_agent
  tags: [gvisor]
  become: true
  vars:
    # Gepinnt wie die Rolle in requirements.yml: einmal grün gelaufen, dann
    # eingefroren, damit ein Neuaufbau in Monaten denselben Stand zieht. Die
    # Prüfsummen liegen unter derselben URL mit der Endung .sha512 und gelten
    # für genau diese Release-Nummer.
    gvisor_version: "20260721.0"
    gvisor_binaries:
      - name: runsc
        sha512: "5de08aa2c048f85289084a6c65648a49dea510da54677a196f223fbf08499c36741da79976b51e0e2b61063bde01ef2a709c7ced95b6d829d9a3c0f3c68b78ab"
      - name: containerd-shim-runsc-v1
        sha512: "a6562b8c5557ef56a6dac35bd957a8682b513d649f35c6c0d37974165f2a9b989a032225c4b829cafa852fc6ce75094446a45add3505e31eb291a3ce4c51bff3"
  tasks:
    - name: Laufzeit runsc einrichten
      ansible.builtin.import_tasks: tasks/gvisor.yaml
  handlers:
    # k3s rendert die containerd-Konfiguration beim Start aus der Vorlage neu.
    # Ohne Neustart bleibt der Eintrag für runsc wirkungslos.
    - name: K3s-Agent neu starten
      ansible.builtin.systemd:
        name: k3s-agent
        state: restarted

# Die RuntimeClass ist ein Objekt im Cluster, angelegt wird sie deshalb über
# den Server. Der Handler muss so heißen wie die Laufzeit im containerd-Block.
- name: RuntimeClass für gVisor anlegen
  hosts: judge_k3s_server
  tags: [gvisor]
  become: true
  tasks:
    - name: RuntimeClass gvisor
      kubernetes.core.k8s:
        state: present
        kubeconfig: /etc/rancher/k3s/k3s.yaml
        definition:
          apiVersion: node.k8s.io/v1
          kind: RuntimeClass
          metadata:
            name: gvisor
          handler: runsc

# Die eigene API als Helm-Release (Issue #15/#17). MongoDB, Redis, der
# Judge-Worker und der Seed der Aufgaben sind Infrastruktur und stehen schon im
# Cluster. Läuft auf dem Server (dort liegt die kubeconfig) und vor der
# Auth-Kette, damit der backend-Service steht, wenn die geschützte Ingress ihn
# referenziert. Die Konfiguration kommt aus vars/app.yaml, Secrets braucht die
# App keine.
- name: Anwendung ausrollen
  hosts: judge_k3s_server
  tags: [app]
  become: true
  vars_files:
    - vars/app.yaml
  tasks:
    - name: Anwendung
      ansible.builtin.import_tasks: tasks/app.yaml

# Authentifizierung am Gateway (Issue #20): Keycloak und das Traefik-OIDC-Plugin
# (traefik-oidc-auth) samt Middleware. Läuft auf dem Server, weil dort die
# kubeconfig liegt und rfc2136_zone (aus dns-credentials.yaml) für die
# Hostnamen gesetzt ist. Die nicht-geheime Konfiguration kommt aus
# vars/auth.yaml, die Secrets aus auth-credentials.yaml (Vorlage: .example).
- name: Auth-Kette ausrollen
  hosts: judge_k3s_server
  tags: [auth]
  become: true
  vars_files:
    - vars/auth.yaml
    - auth-credentials.yaml
  tasks:
    # Zuerst das Plugin aktivieren: Traefik startet dabei neu, was Zeit
    # braucht, und die Middleware unten setzt es voraus.
    - name: Traefik-Plugin
      ansible.builtin.import_tasks: tasks/traefik-plugin.yaml
    - name: Keycloak
      ansible.builtin.import_tasks: tasks/keycloak.yaml
    - name: Traefik-Anbindung
      ansible.builtin.import_tasks: tasks/traefik-auth.yaml
