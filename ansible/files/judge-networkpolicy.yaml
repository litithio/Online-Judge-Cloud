# Namespace-weites default-deny für ein- und ausgehenden Verkehr (#62). Der
# leere podSelector trifft jeden Pod in judge, ohne ingress- und egress-Block
# bleibt nichts erlaubt. Die Ausnahmen stehen als eigene Policies daneben.
#
# Ein Pod ohne eigene Egress-Policy verliert damit auch DNS und findet dann
# gar nichts mehr, auch nicht die Dienste im eigenen Namespace. Wer eine neue
# Komponente in judge aufnimmt, braucht mindestens eine Regel auf kube-dns.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: "{{ app_namespace }}"
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
