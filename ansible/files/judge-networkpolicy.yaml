# Namespace-weites default-deny für eingehenden Verkehr (#62). Der leere
# podSelector trifft jeden Pod in judge, ohne ingress-Block bleibt nichts
# erlaubt. Die Ausnahmen stehen als eigene Policies daneben: valkey,
# mongodb, backend (aus dem Chart) und keycloak.
#
# Vorerst nur Ingress. Egress kommt erst, wenn die Regeln für DNS und die
# K8s-API stehen -- ohne die verlören MongoDB-Pods, der MongoDB-Operator
# und die Worker still ihre Verbindungen.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: "{{ app_namespace }}"
spec:
  podSelector: {}
  policyTypes:
    - Ingress
