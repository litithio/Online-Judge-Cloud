# Ingress nur von Traefik (#62). Keycloak liegt trotz eigener Variable im
# selben Namespace wie die Anwendung (auth_namespace == judge), die Trennung
# der Login-Sitzung läuft über den eigenen Host.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: keycloak
  namespace: "{{ auth_namespace }}"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: keycloakx
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 8080
  egress:
    # Keycloak baut von sich aus nur DNS-Anfragen auf. Die Datenbank ist
    # dev-file (H2 auf dem PVC), der Realm kommt als ConfigMap, ein externer
    # Identity Provider oder SMTP ist nicht konfiguriert.
    #
    # KC_CACHE_STACK=jdbc-ping bildet bei replicas: 1 keinen Cluster. Ab dem
    # zweiten Pod braucht es hier eine Regel für Keycloak untereinander.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
