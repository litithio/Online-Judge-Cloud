# Login-Theme dhbw für Keycloak (#122). Kein eigenes Freemarker-Template, die
# Seite kommt aus login.ftl des Elterns keycloak.v2. Das Theme tauscht nur die
# Klassen aus, die keycloak.v2 über diese Einträge in die Vorlage schreibt.
# Die Klassen stammen aus docs/oberflaeche/login.html, die Regeln dazu stehen
# im Block Anmeldung von dhbw.css und hängen alle an .anmeldung.
#
# Eine leere Zuweisung ist Absicht. Ohne sie erbt die Vorlage die
# PatternFly-Klasse des Elterns, und ein fehlender Eintrag bricht das
# Rendering, weil die Vorlage ihn ohne Vorgabewert liest.
parent=keycloak.v2
import=common/keycloak

# Nur dhbw.css, kein PatternFly. Der Pfad zeigt in login/resources.
styles=dhbw.css
stylesCommon=
darkMode=false

# Gerüst der Seite. body trägt .anmeldung, das erste div darunter ist die Karte.
kcHtmlClass=
kcBodyClass=anmeldung
kcLogin=karte
kcLoginContainer=
kcLoginMain=
kcLoginMainHeader=
kcLoginMainTitle=
kcLoginMainHeaderUtilities=
kcLoginMainBody=
kcLoginMainFooter=
kcContentWrapperClass=
kcMarginTopClass=

# Formular und Felder. Die Regeln in dhbw.css greifen über label und input.
kcFormClass=
kcFormGroupClass=
kcFormGroupLabelClass=
kcFormLabelClass=
kcFormLabelTextClass=
kcInputClass=
kcInputRequiredClass=
kcInputGroup=
kcInputGroupItemClass=
kcFill=
kcError=
kcFormReadOnlyClass=
kcFormPasswordVisibilityButtonClass=
kcFormPasswordVisibilityIconShow=
kcFormPasswordVisibilityIconHide=
kcFormControlUtilClass=
kcInputErrorIconStatusClass=
kcInputErrorIconClass=
kcFormHelperTextClass=
kcInputHelperTextClass=
kcInputHelperTextItemClass=
kcInputHelperTextItemTextClass=
kcFormActionGroupClass=
kcCheckboxClass=merken
kcCheckboxInputClass=
kcCheckboxLabelClass=
kcCheckboxLabelRequiredClass=

# Fehlermeldungen. Beide Wege von Keycloak, die Meldung über dem Formular und
# die Meldung am Feld, bekommen dieselbe Box aus dem Entwurf.
kcAlertClass=fehler sichtbar
kcAlertIconClass=
kcAlertTitleClass=
kcAlertDescriptionClass=
kcInputErrorMessageClass=fehler sichtbar
kcFeedbackErrorIcon=
kcFeedbackWarningIcon=
kcFeedbackSuccessIcon=
kcFeedbackInfoIcon=

# Schaltflächen.
kcButtonClass=knopf
kcButtonPrimaryClass=knopf
kcButtonSecondaryClass=knopf zweit
kcButtonBlockClass=
kcButtonLinkClass=
