# Passwort-Secrets der MongoDB-Benutzer, ein Benutzer je Dienst (#61). Die
# Werte kommen aus app-credentials.sops.yaml, die das Play über load_vars
# entschlüsselt, deshalb liegt die Datei selbst ohne Geheimnis im Repo.
# tasks/mongodb.yaml rendert sie als Template und legt die Secrets an, der
# Operator liest sie über passwordSecretRef in mongodb-instance.yaml.
apiVersion: v1
kind: List
items:
  - apiVersion: v1
    kind: Secret
    metadata:
      name: mongodb-backend-password
      namespace: "{{ app_namespace }}"
    type: Opaque
    stringData:
      password: "{{ mongodb_backend_password }}"
  - apiVersion: v1
    kind: Secret
    metadata:
      name: mongodb-worker-password
      namespace: "{{ app_namespace }}"
    type: Opaque
    stringData:
      password: "{{ mongodb_worker_password }}"
  - apiVersion: v1
    kind: Secret
    metadata:
      name: mongodb-durchlauf-password
      namespace: "{{ app_namespace }}"
    type: Opaque
    stringData:
      password: "{{ mongodb_durchlauf_password }}"
  - apiVersion: v1
    kind: Secret
    metadata:
      name: mongodb-loader-password
      namespace: "{{ app_namespace }}"
    type: Opaque
    stringData:
      password: "{{ mongodb_loader_password }}"
