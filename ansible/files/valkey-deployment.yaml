# Reiner Deployment statt Operator: Valkey hält hier nur die IDs wartender
# Einreichungen, MongoDB bleibt die Wahrheit für Inhalt und Status (#82). Ein
# einzelner Pod genügt deshalb, anders als beim MongoDB-Replicaset in
# mongodb-instance.yaml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: valkey
  namespace: "{{ app_namespace }}"
  labels:
    app: valkey
spec:
  replicas: 1
  # Recreate statt RollingUpdate: der PVC ist ReadWriteOnce, ein zweiter Pod
  # könnte ihn während eines Rollouts nicht gleichzeitig mounten.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: valkey
  template:
    metadata:
      labels:
        app: valkey
    spec:
      # Wie bei MongoDB, die Warteschlange gehört nicht auf einen Node, der
      # fremden Code ausführt.
      nodeSelector:
        online-judge/rolle: dienste
      containers:
        - name: valkey
          image: valkey/valkey:8-alpine
          args: ["valkey-server", "--appendonly", "yes"]
          ports:
            - containerPort: 6379
          # Gemessen unter Last am 27.08. über Prometheus, ein Lauf des
          # Lastgenerators mit 180 Einreichungen, Warteschlange bis 77.
          # Spitze 5,0m und 8,8 MiB, im Leerlauf 4m und 7 MiB. Valkey hält
          # nur die IDs wartender Einreichungen, der Speicher wächst darum
          # auch mit der Warteschlange kaum.
          #
          # Der Speicher-Request rechnet die Spitze doppelt, denn der
          # AOF-Rewrite forkt den Prozess, und Copy-on-Write kann den
          # Verbrauch währenddessen bis zur Verdopplung treiben. Das wären
          # 18 MiB, aufgerundet auf 32Mi. Solange der Verbrauch unter dem
          # Request bleibt, räumt der Node den Pod bei Speichermangel
          # zuletzt ab.
          #
          # Der CPU-Request verdoppelt die gemessene Spitze auf 10m. Er ist
          # eine Zusage an den Scheduler und keine Obergrenze, kurze Spitzen
          # wie ein AOF-Rewrite laufen darüber hinaus und finden ihre Grenze
          # erst im Limit. Gemessen ist der Rewrite nicht, das AOF war für
          # die Mindestgröße von 64 MB zu klein.
          #
          # Die Limits bleiben unverändert, gemessen ist nichts, was ihnen
          # nahekommt, sie begrenzen nur den Schaden.
          resources:
            requests:
              cpu: "10m"
              memory: "32Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          readinessProbe:
            exec:
              command: ["valkey-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["valkey-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: valkey-data
