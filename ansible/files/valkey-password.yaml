# Passwort-Secret von Valkey (#61). Der Wert kommt aus
# app-credentials.sops.yaml, die das Play über load_vars entschlüsselt,
# deshalb liegt die Datei selbst ohne Geheimnis im Repo.
#
# Ein Passwort für den ganzen Dienst, kein Benutzer je Dienst wie bei
# MongoDB: Valkey kennt mit requirepass nur ein einziges Passwort, nicht
# mehrere Benutzer mit eigenen Rechten.
#
# Nur das rohe Passwort. Die URI für Backend, Worker und durchlauf leitet
# ansible/tasks/valkey.yaml daraus ab und legt sie als connectionString in
# dasselbe Secret, damit beide Werte nicht auseinanderlaufen. Der
# KEDA-Trigger liest password direkt (TriggerAuthentication in judge.yaml).
apiVersion: v1
kind: Secret
metadata:
  name: valkey-app-password
  namespace: "{{ app_namespace }}"
type: Opaque
stringData:
  password: "{{ valkey_password }}"
