# Fremder Code, in ## Entscheidungen benannt (Issue #5). Anders als in der
# GridFlex-Übung auf feste Stände gepinnt: einmal grün gelaufen, dann
# eingefroren, damit ein Neuaufbau in Monaten denselben Stand zieht.
---
roles:
  # Eigener Fork, Branch main, zusammengeführt mit dem Stand von Pfisterer vom
  # 26.08. Aus dem Fork kommen k3s_node_labels, die Longhorn-Voraussetzungen
  # nur auf den Dienste-Nodes und der Umbau des Overlay-Preflights, der einen
  # gescheiterten Sender von einem blockierten Port unterscheidet. Aus dem
  # Upstream kommen der Fix, mit dem die Tags der Rolle ihre Tasks erreichen,
  # ein nutzbarer --check-Lauf und der auf v1.20.3 gepinnte cert-manager-Chart.
  # Der Pin hebt cert-manager nicht mehr mit dem Kalender, ein Cluster auf
  # v1.21.1 bekommt dafür beim nächsten Lauf ein Downgrade.
  - name: k3s-dhbw-cloud-role
    src: https://github.com/litithio/k3s-dhbw-cloud-role.git
    version: c2b7260676567eeaee2d3de9d3485b1b9dc669a5

# Die Rolle setzt auf dem Steuerrechner diese Collections voraus:
# kubernetes.core für die Helm- und k8s-Module, ansible.posix für sysctl.
collections:
  - name: kubernetes.core
    version: 6.5.0
  - name: ansible.posix
    version: 2.2.2
