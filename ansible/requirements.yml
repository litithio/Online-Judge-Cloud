# Fremder Code, in ## Entscheidungen benannt (Issue #5). Anders als in der
# GridFlex-Übung auf feste Stände gepinnt: einmal grün gelaufen, dann
# eingefroren, damit ein Neuaufbau in Monaten denselben Stand zieht.
---
roles:
  # Stand main vom 2026-08-03. Der Sprung holt external-dns v0.21.0 und die
  # jetzt gepinnte Chart-Version, dazu die multipathd-Blacklist: multipathd
  # läuft auf allen vier Nodes und greift sonst nach den iSCSI-Geräten, die
  # Longhorn einhängt, was das Mounten scheitern lässt.
  - name: k3s-dhbw-cloud-role
    src: https://github.com/pfisterer/k3s-dhbw-cloud-role.git
    version: 613b3c46d0428f99ddbfe65019cbb4b1afd10d3b

# Die Rolle setzt auf dem Steuerrechner diese Collections voraus:
# kubernetes.core für die Helm- und k8s-Module, ansible.posix für sysctl.
collections:
  - name: kubernetes.core
    version: 6.5.0
  - name: ansible.posix
    version: 2.2.2
