---
# Rollt die eigenen Dienste als Helm-Release in den Cluster aus (Issue #15/#17),
# also die API und die Judge-Kette. MongoDB, Valkey und der Seed der Aufgaben
# gehören zur Infrastruktur und stehen schon im Cluster, das Chart verbindet
# sich mit den Datendiensten nur über die Adressen aus values.
#
# Läuft auf dem Server, weil dort die kubeconfig liegt. Der Chart steht im Repo
# unter app/chart; die Helm-Module laufen aber auf dem Server, deshalb wird er
# zuerst dorthin kopiert.

# Erst löschen, dann kopieren. ansible.builtin.copy legt an und überschreibt,
# es entfernt nichts. Eine im Repo gelöschte oder umbenannte Vorlage steht
# sonst auf dem Server weiter, und Helm rollt sie beim nächsten Lauf mit aus.
# ansible.posix.synchronize mit delete wäre der schmalere Weg, scheitert aber
# vom Mac aus. Das Modul übergibt das Ziel als [user@2001:...]:pfad, und das
# openrsync von macOS liest daraus die Adresse 0.0.7.209. Die drei Tasks melden
# deshalb bei jedem Lauf changed.
- name: Alten Chart-Stand auf dem Server entfernen
  ansible.builtin.file:
    path: "{{ app_chart_remote }}"
    state: absent

- name: Verzeichnis für den Chart auf dem Server
  ansible.builtin.file:
    path: "{{ app_chart_remote }}"
    state: directory
    mode: "0755"

- name: Chart auf den Server kopieren
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../app/chart/"
    dest: "{{ app_chart_remote }}/"
    mode: "0644"
    directory_mode: "0755"

# Vor dem Helm-Aufruf, denn ohne den Wert bricht das Backend beim Start ab
# (app/backend/auth.py). Denselben Wert setzt das Gateway als Header, die
# Middleware dafür steht in tasks/traefik-auth.yaml.
#
# Auf einem frischen Cluster genügt ein Lauf des ganzen Playbooks. Die Ingress
# entsteht erst im Auth-Play danach, vorher erreicht niemand die API. Auf einem
# laufenden Cluster gilt --tags auth vor --tags app, sonst verlangt das neue
# Backend den Header, bevor die Middleware ihn setzt. Das alte Backend stört
# der Header nicht.
#
# Ein Wechsel des Werts braucht dieselbe Reihenfolge und danach ein
# kubectl rollout restart deployment/backend. secretKeyRef liest den Wert nur
# beim Start des Containers, und das Deployment führt keine Prüfsumme über das
# Secret.
- name: Secret mit dem Herkunftswert des Gateways
  kubernetes.core.k8s:
    state: present
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: gateway-auth
        namespace: "{{ app_namespace }}"
      type: Opaque
      stringData:
        secret: "{{ gateway_secret }}"
  no_log: true

- name: Anwendung über Helm ausrollen
  kubernetes.core.helm:
    name: online-judge
    chart_ref: "{{ app_chart_remote }}"
    release_namespace: "{{ app_namespace }}"
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    # Die Vorgaben aus values.yaml, überlagert von der Umgebung (prod/dev), und
    # der Image-Tag als Einzelwert. So steht der laufende Stand an einer Stelle
    # (vars/app.yaml) und nicht in der eingecheckten values-Datei.
    values_files:
      - "{{ app_chart_remote }}/values-{{ app_values_env }}.yaml"
    values:
      image:
        tag: "{{ app_image_tag }}"
    # Kein wait: die readiness des Backends hängt an MongoDB, ein wait würde
    # das Play bei gestörter Datenbank blockieren statt etwas abzusichern.
    # Helm kehrt direkt nach dem Anlegen der Objekte zurück, den Rollout
    # überwacht Kubernetes über die Probes im Chart.
    wait: false
