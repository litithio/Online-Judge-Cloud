---
# Die Judge-Kette aus app/k8s: Worker-Deployment, Rückhol-CronJob und das
# KEDA-ScaledObject. Die Manifeste bleiben in app/k8s neben dem Code, das Play
# spielt sie unverändert ein, damit Hand-Aufruf (kubectl apply) und Vollauf
# denselben Stand erzeugen.

# namespace am Modul, nicht im Manifest: worker.yaml und durchlauf-cronjob.yaml
# tragen keinen, bei kubectl apply nimmt der Kontext den default, das Modul
# verlangt ihn ausdrücklich.
- name: Worker-Deployment anlegen
  kubernetes.core.k8s:
    state: present
    namespace: default
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    definition: "{{ lookup('file', playbook_dir ~ '/../app/k8s/worker.yaml') | from_yaml }}"

- name: Durchlauf-CronJob anlegen
  kubernetes.core.k8s:
    state: present
    namespace: default
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    definition: "{{ lookup('file', playbook_dir ~ '/../app/k8s/durchlauf-cronjob.yaml') | from_yaml }}"

- name: ScaledObject für den Python-Worker anlegen
  kubernetes.core.k8s:
    state: present
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    definition: "{{ lookup('file', playbook_dir ~ '/../app/k8s/keda-scaledobject-python.yaml') | from_yaml }}"

# Der Seed. laden.py und die Aufgaben-JSONs liegen nicht im Worker-Image
# (Build-Kontext ist app/worker), deshalb kommen sie als ConfigMap in den
# Cluster und ein Job führt das Skript aus dem Mount aus. laden.py liest die
# JSONs aus seinem eigenen Verzeichnis, der Mount unter /seed genügt also.
- name: Aufgaben und Seed-Skript einsammeln
  ansible.builtin.set_fact:
    seed_daten: "{{ (seed_daten | default({})) | combine({item | basename: lookup('file', item)}) }}"
  loop: "{{ (lookup('fileglob', playbook_dir ~ '/../app/aufgaben/*.json', wantlist=True) + [playbook_dir ~ '/../app/aufgaben/laden.py']) | sort }}"
  loop_control:
    label: "{{ item | basename }}"

- name: ConfigMap mit den Aufgaben und dem Seed-Skript
  kubernetes.core.k8s:
    state: present
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: aufgaben-seed
        namespace: default
      data: "{{ seed_daten }}"

# Jobs sind nach dem Anlegen unveränderlich, ein geänderter Seed braucht
# deshalb einen frischen Job. laden.py ist idempotent, der Titel ist der
# Schlüssel, ein zweiter Lauf aktualisiert statt zu doppeln.
- name: Alten Seed-Job entfernen
  kubernetes.core.k8s:
    state: absent
    api_version: batch/v1
    kind: Job
    name: aufgaben-seed
    namespace: default
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    wait: true

- name: Seed-Job ausführen
  kubernetes.core.k8s:
    state: present
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    wait: true
    wait_condition:
      type: Complete
      status: "True"
    wait_timeout: 300
    definition:
      apiVersion: batch/v1
      kind: Job
      metadata:
        name: aufgaben-seed
        namespace: default
      spec:
        backoffLimit: 2
        template:
          spec:
            restartPolicy: Never
            containers:
              - name: seed
                # Dasselbe Image wie der Worker: pymongo liegt dort schon, ein
                # eigenes Seed-Image wäre ein weiterer Build für ein Skript.
                image: ghcr.io/litithio/online-judge-worker:0.2.5
                command: ["python", "/seed/laden.py"]
                env:
                  - name: MONGO_URI
                    valueFrom:
                      secretKeyRef:
                        name: mongodb-coding-platform-app
                        key: connectionString.standard
                volumeMounts:
                  - name: seed
                    mountPath: /seed
                    readOnly: true
            volumes:
              - name: seed
                configMap:
                  name: aufgaben-seed
