# === KEDA ===
# Skaliert die Sprach-Worker über die Länge ihrer Liste in Valkey
# (ScaledObject je Sprache, app/chart/templates/judge.yaml). Wie beim
# MongoDB-Operator ein Helm-Chart, eigener Namespace, damit die CRDs und die
# wenigen Systemkomponenten nicht im default-Namespace zwischen App und
# Datenbank stehen.
- name: Add KEDA Helm repository
  kubernetes.core.helm_repository:
    name: kedacore
    repo_url: https://kedacore.github.io/charts

- name: Install KEDA operator
  kubernetes.core.helm:
    name: keda
    chart_ref: kedacore/keda
    chart_version: "2.16.1"
    release_namespace: keda
    create_namespace: true
    wait: true
    kubeconfig: "{{ kubeconfig_root }}"
    values:
      # Der Operator kennt die Länge von judge:python, er fragt sie für die
      # Skalierung ohnehin ab. Ohne diesen Wert hält er sie für sich, der Port
      # bleibt zu und keda_scaler_metrics_value entsteht nie. Das Dashboard aus
      # tasks/observability.yaml zeigt genau diesen Wert.
      #
      # Nur der Port, kein ServiceMonitor aus diesem Chart. Ein ServiceMonitor
      # braucht die CRD von kube-prometheus-stack, und dann liefe dieser Task
      # allein, also mit --tags keda auf einem frischen Cluster, gegen eine
      # unbekannte Ressource. Den ServiceMonitor legt tasks/observability.yaml
      # an, wo die CRD ohnehin herkommt.
      prometheus:
        operator:
          enabled: true
