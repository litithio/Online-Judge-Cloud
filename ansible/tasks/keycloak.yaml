---
# Keycloak mit zwei Replicas gegen PostgreSQL aus CloudNativePG (#163). Der
# Realm samt Gateway-Client, Rolle dozent und die beiden Konten kommt als Code
# aus templates/keycloak-realm.json.j2. Ein Job vor dem Helm-Task spielt die
# Vorlage mit kc.sh import --override true in die Datenbank, sobald sie sich
# von der zuletzt importierten unterscheidet, siehe den Job-Task unten (#146,
# #163).
#
# PostgreSQL statt H2: Die H2-Datei verträgt keinen zweiten Prozess, und erst
# ein zweiter Pod trägt ein Rolling Update ohne Ausfall (P5). Der Cluster
# keycloak-db kommt aus tasks/postgres.yaml.

- name: Namespace für die Auth-Dienste
  kubernetes.core.k8s:
    state: present
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ auth_namespace }}"

# Bootstrap-Admin nur für die Admin-Konsole. no_log, damit das Passwort nicht
# im Ansible-Protokoll steht.
- name: Secret mit dem Keycloak-Admin-Passwort
  kubernetes.core.k8s:
    state: present
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: keycloak-admin
        namespace: "{{ auth_namespace }}"
      type: Opaque
      stringData:
        KC_BOOTSTRAP_ADMIN_USERNAME: admin
        KC_BOOTSTRAP_ADMIN_PASSWORD: "{{ keycloak_admin_password }}"
  no_log: true

# Der gerenderte Realm. Der Import-Job liest ihn aus data/import, das Secret
# wird dort in genau dieses Verzeichnis gemountet. Ein Secret statt
# einer ConfigMap, weil die Vorlage das Client-Secret und
# die Passwörter beider Konten trägt. Eine ConfigMap liest jeder mit der
# Rolle view im Namespace, ein Secret nicht.
- name: Secret mit dem Realm-Import
  kubernetes.core.k8s:
    state: present
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: keycloak-realm-import
        namespace: "{{ auth_namespace }}"
      stringData:
        realm.json: "{{ lookup('template', 'templates/keycloak-realm.json.j2') }}"
  no_log: true

# Der Import läuft nur bei geänderter Vorlage. Ein Override nimmt den ganzen
# Realm mit, auch seine Signaturschlüssel, und das Traefik-Plugin lädt neue
# Schlüssel höchstens alle fünf Minuten nach (siehe #146). Der Merker mit der
# Prüfsumme lag bisher auf dem PVC, ohne PVC liegt er in einer ConfigMap.
- name: Merker des letzten Realm-Imports lesen
  kubernetes.core.k8s_info:
    kind: ConfigMap
    name: keycloak-realm-import-merker
    namespace: "{{ auth_namespace }}"
    kubeconfig: /etc/rancher/k3s/k3s.yaml
  register: realm_merker

# Der Merker trägt neben der Prüfsumme die UID des Postgres-Clusters. Ein neu
# angelegter Cluster hat eine leere Datenbank und eine neue UID, der Import
# läuft dann auch bei unveränderter Vorlage. Zwei Tasks, weil ein set_fact
# seine eigenen neuen Werte im selben Task noch nicht kennt.
# failed_when false, weil das Modul ohne die CRD des Operators mit einem
# API-Fehler abbräche, statt eine leere Liste zu liefern. Die Prüfung darunter
# fängt beide Fälle mit einer lesbaren Meldung.
- name: Postgres-Cluster lesen
  kubernetes.core.k8s_info:
    api_version: postgresql.cnpg.io/v1
    kind: Cluster
    name: "{{ keycloak_db_name }}"
    namespace: "{{ auth_namespace }}"
    kubeconfig: /etc/rancher/k3s/k3s.yaml
  register: keycloak_db
  failed_when: false

# Ein Lauf mit --tags auth ohne postgres fände auf einem neuen Cluster keine
# Datenbank. Die Meldung nennt den Weg, statt dass der nächste Task mit einem
# Index-Fehler abbricht.
- name: Postgres-Cluster muss vorhanden sein
  ansible.builtin.assert:
    that: keycloak_db.resources | default([]) | length > 0
    fail_msg: "Kein Cluster {{ keycloak_db_name }} in {{ auth_namespace }}, zuerst --tags postgres fahren"

- name: Prüfsumme der gerenderten Vorlage merken
  ansible.builtin.set_fact:
    realm_summe: "{{ lookup('template', 'templates/keycloak-realm.json.j2') | hash('sha256') }}"
    realm_db_uid: "{{ keycloak_db.resources[0].metadata.uid }}"

- name: Entscheiden, ob der Import läuft
  ansible.builtin.set_fact:
    realm_import_noetig: >-
      {{ realm_merker.resources | length == 0
         or realm_merker.resources[0].data.sha256 != realm_summe
         or realm_merker.resources[0].data.cluster_uid | default('') != realm_db_uid }}

- name: NetworkPolicy für den Import-Job anwenden
  kubernetes.core.k8s:
    state: present
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    definition: "{{ lookup('template', 'files/keycloak-realm-import-networkpolicy.yaml') | from_yaml }}"

# Beim Import mit Override müssen alle Keycloak-Nodes stehen (Keycloak-Doku,
# Importing and exporting realms), sonst halten die laufenden Pods veraltete
# Caches. Auf einem frischen Cluster gibt es das StatefulSet noch nicht, dann
# entfällt das Anhalten.
- name: StatefulSet von Keycloak lesen
  kubernetes.core.k8s_info:
    kind: StatefulSet
    name: keycloak-keycloakx
    namespace: "{{ auth_namespace }}"
    kubeconfig: /etc/rancher/k3s/k3s.yaml
  register: keycloak_sts
  when: realm_import_noetig

# k8s_scale kennt kein StatefulSet, deshalb Patches auf spec.replicas. Nach
# einem gelungenen Import bleibt Keycloak auf 0, bis der Helm-Task die neue
# Vorlage gesetzt hat, der Task hinter dem Helm-Task hebt dann auf 2. Sonst
# starteten die Pods erst mit der alten Vorlage, beim Wechsel von H2 also
# noch einmal mit H2, und der Helm-Task ersetzte sie gleich wieder. Nur ein
# gescheiterter Import bringt über rescue die alten Pods zurück, damit der
# Lauf nicht mit 0 Replicas endet.
- name: Realm bei angehaltenem Keycloak importieren
  when: realm_import_noetig
  block:
    - name: Keycloak für den Import anhalten
      kubernetes.core.k8s:
        state: patched
        kubeconfig: /etc/rancher/k3s/k3s.yaml
        kind: StatefulSet
        name: keycloak-keycloakx
        namespace: "{{ auth_namespace }}"
        definition:
          spec:
            replicas: 0
      when: keycloak_sts.resources | length > 0

    - name: Warten, bis kein Keycloak-Pod mehr läuft
      kubernetes.core.k8s_info:
        kind: Pod
        namespace: "{{ auth_namespace }}"
        label_selectors:
          - app.kubernetes.io/name=keycloakx
        kubeconfig: /etc/rancher/k3s/k3s.yaml
      register: keycloak_pods
      until: keycloak_pods.resources | length == 0
      retries: 24
      delay: 5
      when: keycloak_sts.resources | length > 0

    # Ein Job ist unveränderlich, ein alter Lauf muss deshalb weg, bevor der
    # neue entsteht. Fehlt er, ist absent ohne Wirkung.
    - name: Alten Import-Job entfernen
      kubernetes.core.k8s:
        state: absent
        kubeconfig: /etc/rancher/k3s/k3s.yaml
        api_version: batch/v1
        kind: Job
        name: keycloak-realm-import
        namespace: "{{ auth_namespace }}"
        wait: true

    - name: Import-Job anlegen
      kubernetes.core.k8s:
        state: present
        kubeconfig: /etc/rancher/k3s/k3s.yaml
        definition: "{{ lookup('template', 'files/keycloak-realm-import-job.yaml') | from_yaml }}"

    # Eigenes Warten statt wait_condition am Job, denn das Modul wartet nur
    # auf Complete und ließe einen gescheiterten Job bis zum Timeout stehen.
    # Hier endet das Warten mit Complete oder Failed, und Failed bricht den
    # Lauf ab. 72 mal 5 Sekunden liegen über activeDeadlineSeconds des Jobs,
    # ein hängender Import ist also beendet, bevor rescue Keycloak wieder
    # startet, sonst liefe der Import neben laufenden Keycloak-Pods.
    - name: Auf das Ende des Import-Jobs warten
      kubernetes.core.k8s_info:
        api_version: batch/v1
        kind: Job
        name: keycloak-realm-import
        namespace: "{{ auth_namespace }}"
        kubeconfig: /etc/rancher/k3s/k3s.yaml
      register: realm_job
      until: >-
        realm_job.resources | length > 0
        and (realm_job.resources[0].status.conditions | default([]))
            | selectattr('status', 'equalto', 'True')
            | selectattr('type', 'in', ['Complete', 'Failed'])
            | list | length > 0
      retries: 72
      delay: 5

    - name: Import-Job auf Erfolg prüfen
      ansible.builtin.assert:
        that:
          - >-
            realm_job.resources[0].status.conditions
            | selectattr('status', 'equalto', 'True')
            | selectattr('type', 'equalto', 'Complete')
            | list | length > 0
        fail_msg: "Der Realm-Import ist gescheitert, siehe kubectl -n {{ auth_namespace }} logs job/keycloak-realm-import"

    # Erst nach dem Import geschrieben, ein abgebrochener Import läuft beim
    # nächsten Lauf erneut.
    - name: Merker des Realm-Imports schreiben
      kubernetes.core.k8s:
        state: present
        kubeconfig: /etc/rancher/k3s/k3s.yaml
        definition:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: keycloak-realm-import-merker
            namespace: "{{ auth_namespace }}"
          data:
            sha256: "{{ realm_summe }}"
            cluster_uid: "{{ realm_db_uid }}"

  rescue:
    - name: Keycloak nach dem gescheiterten Import wieder starten
      kubernetes.core.k8s:
        state: patched
        kubeconfig: /etc/rancher/k3s/k3s.yaml
        kind: StatefulSet
        name: keycloak-keycloakx
        namespace: "{{ auth_namespace }}"
        definition:
          spec:
            replicas: "{{ keycloak_sts.resources[0].spec.replicas }}"
      when: keycloak_sts.resources | length > 0

    - name: Lauf nach dem gescheiterten Import abbrechen
      ansible.builtin.fail:
        msg: "Der Realm-Import ist gescheitert, Keycloak läuft mit dem alten Realm weiter. Log: kubectl -n {{ auth_namespace }} logs job/keycloak-realm-import"

# Das Login-Theme im DHBW-Layout (#122). Fünf Dateien, gemountet als Ordner
# /opt/keycloak/themes/dhbw, siehe extraVolumes unten. theme.properties und
# die Meldungen liegen in files/keycloak-theme, dhbw.css und das Logo kommen
# aus app/backend/static, damit Anwendung und Anmeldung dieselbe Datei tragen.
# messages_en bleibt neben messages_de, damit die Überschrift auch in einem
# Realm gilt, der nicht auf Deutsch steht.
# Eine ConfigMap statt eines eigenen Keycloak-Image, weil das Theme nichts
# Geheimes trägt und kein zusätzlicher Build anfällt.
#
# Das Logo ist binär, lookup('file') liest nur Text. slurp auf dem
# Kontrollknoten liefert es base64-kodiert, so wie binaryData es erwartet.
# become aus, sonst fragt der Kontrollknoten nach dem sudo-Passwort.
- name: Logo für das Login-Theme lesen
  ansible.builtin.slurp:
    src: "{{ playbook_dir }}/../app/backend/static/logo.jpg"
  delegate_to: localhost
  become: false
  register: keycloak_theme_logo

- name: ConfigMap mit dem Login-Theme
  kubernetes.core.k8s:
    state: present
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: keycloak-theme-dhbw
        namespace: "{{ auth_namespace }}"
      data:
        theme.properties: "{{ lookup('file', 'files/keycloak-theme/theme.properties') }}"
        messages_de.properties: "{{ lookup('file', 'files/keycloak-theme/messages_de.properties') }}"
        messages_en.properties: "{{ lookup('file', 'files/keycloak-theme/messages_en.properties') }}"
        dhbw.css: "{{ lookup('file', playbook_dir ~ '/../app/backend/static/dhbw.css') }}"
      binaryData:
        logo.jpg: "{{ keycloak_theme_logo.content }}"

# retries, weil Helm den Chart bei jedem Lauf von github.com lädt und GitHub
# in Wellen Verbindungen abweist (beobachtet am 12. und 13.08.2026, betrifft
# alle Clients ohne eigene Wiederholung). Fünf Versuche mit 30 Sekunden
# Abstand überbrücken eine kurze Welle, im Erfolgsfall ändert sich nichts.
- name: Keycloak über Helm ausrollen
  register: keycloak_helm
  retries: 5
  delay: 30
  until: keycloak_helm is succeeded
  kubernetes.core.helm:
    name: keycloak
    chart_ref: keycloakx
    chart_repo_url: "{{ keycloak_chart_repo }}"
    chart_version: "{{ keycloak_chart_version }}"
    release_namespace: "{{ auth_namespace }}"
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    # wait bleibt aus, auf die Bereitschaft wartet der rollout-status-Task
    # nach diesem Task. Mit wait würden die retries oben jeden Timeout
    # mitwiederholen, ein Pod, der nicht bereit wird, würde den Lauf fünfmal
    # je bis zu 15 Minuten aufhalten.
    wait: false
    timeout: 15m0s
    # Festgeschriebener Default. Werte, die nicht mehr in der Datei stehen,
    # fallen damit bei jedem Lauf auch aus dem Release, statt dort liegenzubleiben.
    reset_values: true
    values:
      # Zwei Replicas für das Rolling Update (P5). Der Chart trägt eine harte
      # Anti-Affinity über kubernetes.io/hostname, die Pods liegen auf zwei
      # Dienste-Nodes. Der Sitzungs-Cluster läuft über KC_CACHE_STACK
      # jdbc-ping, der Chart setzt die Variable bei cache.stack default
      # (templates/statefulset.yaml), die Mitglieder finden sich über eine
      # Tabelle in Postgres.
      replicas: 2
      podDisruptionBudget:
        minAvailable: 1
      # Wie bei MongoDB, siehe ansible/files/mongodb-instance.yaml.
      nodeSelector:
        online-judge/rolle: dienste
      image:
        tag: "{{ keycloak_image_tag }}"
      # Produktivmodus. Kein --import-realm, den Import erledigt der Job vor
      # diesem Task, denn start --import-realm überspringt einen vorhandenen
      # Realm (Strategie IGNORE_EXISTING) und kennt kein --override.
      # Die Health-Endpunkte schaltet der Chart selbst über KC_HEALTH_ENABLED
      # ein, ein eigenes Flag im command braucht es dafür nicht. Die Probes
      # kommen unverändert aus dem Chart, startup auf /health, liveness auf
      # /health/live, readiness auf /health/ready, alle am Management-Port 9000.
      command:
        - "/opt/keycloak/bin/kc.sh"
        - "start"
        - "--http-port=8080"
      # Die Prüfsumme der gerenderten Vorlage an der Pod-Vorlage. Ein
      # geändertes Secret allein startet die Pods nicht neu, erst die
      # geänderte Annotation lässt das StatefulSet sie ersetzen, und die neuen
      # Pods lesen den frisch importierten Realm ein. Der Import selbst läuft
      # im Job davor, mit derselben Prüfsumme als Merker.
      podAnnotations:
        checksum/realm: "{{ realm_summe }}"
      # Verbindung zum Cluster aus tasks/postgres.yaml. Der Operator schreibt
      # das Passwort des Besitzers in keycloak-db-app, der Chart liest es von
      # dort als KC_DB_PASSWORD.
      database:
        vendor: postgres
        hostname: "{{ keycloak_db_name }}-rw"
        port: 5432
        database: keycloak
        username: keycloak
        existingSecret: "{{ keycloak_db_name }}-app"
        existingSecretKey: password
      # Wartet vor dem Start, bis Postgres auf 5432 antwortet. Ohne ihn
      # scheitert der erste Start auf einem frischen Cluster an der Datenbank
      # und läuft in die startupProbe.
      dbchecker:
        enabled: true
      # Setzt KC_PROXY_HEADERS=forwarded und KC_HTTP_ENABLED=true, damit Keycloak
      # hinter Traefik die richtigen URLs bildet und intern über HTTP spricht.
      proxy:
        enabled: true
        mode: forwarded
        http:
          enabled: true
      # Ohne führenden /auth: der Issuer lautet dann
      # https://<host>/realms/<realm>, wie das Traefik-OIDC-Plugin ihn erwartet.
      http:
        relativePath: "/"
      # Feste öffentliche Adresse für die Token-Issuer-URL; hostname-strict aus,
      # damit interne Health-Checks über die Service-IP nicht daran scheitern.
      extraEnv: |
        - name: KC_HOSTNAME
          value: "https://{{ keycloak_host }}"
        - name: KC_HOSTNAME_STRICT
          value: "false"
        # Ohne JAVA_OPTS_KC_HEAP leitet kc.sh die Heap-Decke aus dem Limit ab,
        # beim Limit von 1152Mi wären das rund 806Mi. Die 512Mi wählt kc.sh
        # außerhalb eines Containers selbst, sie liegen über dem unter Last
        # belegten Heap von 299Mi. Die Variable ersetzt nur die drei
        # Prozentsatz-Flags, MaxMetaspaceSize bleibt stehen. Der Initial-Heap
        # von 256Mi spart gegenüber 512Mi rund 180Mi im Spitzenwert und kostet
        # Durchsatz, gemessen in einem Gegenlauf zu #165.
        - name: JAVA_OPTS_KC_HEAP
          value: "-Xms256m -Xmx512m"
        # Keycloak öffnet ohne diese Grenze bis zu 100 Verbindungen je Pod,
        # zwei Pods lägen damit über max_connections von Postgres. 20 je Pod
        # decken die gemessenen 18 Anmeldungen je Sekunde, jede hält eine
        # Verbindung nur für Millisekunden. Zwei Pods und der Import-Job
        # kommen so auf höchstens 60 von 100.
        - name: KC_DB_POOL_MAX_SIZE
          value: "20"
      extraEnvFrom: |
        - secretRef:
            name: keycloak-admin
      # Das Theme liegt flach in der ConfigMap, die Pfade in items bauen den
      # Ordnerbaum, den Keycloak für ein Login-Theme erwartet. Keycloak liest
      # den Ordner beim Start, eine geänderte ConfigMap greift erst nach
      # einem Neustart des Pods.
      extraVolumes: |
        - name: theme-dhbw
          configMap:
            name: keycloak-theme-dhbw
            items:
              - key: theme.properties
                path: login/theme.properties
              - key: messages_de.properties
                path: login/messages/messages_de.properties
              - key: messages_en.properties
                path: login/messages/messages_en.properties
              - key: dhbw.css
                path: login/resources/dhbw.css
              - key: logo.jpg
                path: login/resources/logo.jpg
      extraVolumeMounts: |
        - name: theme-dhbw
          mountPath: /opt/keycloak/themes/dhbw
          readOnly: true
      # Gemessen mit app/anmeldelast.py, das echte Anmeldungen über den
      # Authorization-Code-Flow fährt. Der Client judge-gateway erlaubt keine
      # Direktvergabe. Zehn Läufe am 22. und 23.08. mit zusammen 22838
      # Anmeldungen, keiner davon hat den Pod umgeworfen.
      #
      # Der Request von 832Mi deckt den Spitzenwert von 707Mi und lässt
      # Reserve für das Nachrücken. Die JVM gibt einmal belegten Speicher
      # nicht zurück, der Pod bleibt auch nach den Läufen bei 706Mi. Die
      # bisherigen 512Mi lagen unter dem Verbrauch, siehe #161.
      #
      # Das Limit von 1152Mi deckt den ungünstigen Fall. Heap-Decke 512Mi,
      # MaxMetaspaceSize 256Mi, Code-Cache im beobachteten Höchststand 73Mi
      # und 214Mi daneben ergeben 1055Mi. Vor #165 waren es 1281Mi gegen ein
      # Limit von 1024Mi. Ein Limit wird auf dem Node nicht reserviert,
      # geplant wird mit dem Request.
      #
      # Die CPU liegt im Leerlauf bei 2m. Unter Last steht sie am Limit, in
      # einem Lauf über 120 Sekunden waren 1156 von 1205 Perioden gedrosselt.
      # Eine Anmeldung kostet dabei 59 Kern-Millisekunden. Diese 17 je Sekunde
      # sind der ausgereizte Testfall und nicht der Betrieb. Ein Kurs meldet
      # sich stoßweise an und bleibt danach angemeldet, gebraucht wird weit
      # weniger als eine Anmeldung je Sekunde. Rechnerisch entsprechen die
      # 250m gut vier je Sekunde, das Limit von 1000m lässt die gemessenen 17
      # zu.
      resources:
        requests:
          cpu: "250m"
          memory: "832Mi"
        limits:
          cpu: "1000m"
          memory: "1152Mi"
      # DNS und Wildcard-TLS kommen automatisch von external-dns und cert-manager
      # der Rolle, sobald der Host unter der eigenen Zone liegt.
      ingress:
        enabled: true
        rules:
          - host: "{{ keycloak_host }}"
            paths:
              - path: "/"
                pathType: Prefix
        tls:
          - hosts:
              - "{{ keycloak_host }}"

# Nach dem Import steht das StatefulSet auf 0, siehe den Block oben. Helm hebt
# es nur, wenn sich replicas im Manifest geändert hat, also beim Wechsel von
# 1 auf 2. Bei 2 auf 2 patcht Helm nichts, und ohne diesen Task bliebe
# Keycloak aus. Ohne Bedingung, denn bricht der Helm-Task nach einem
# gelungenen Import ab, hält der nächste Lauf den Import nicht mehr für nötig
# und müsste die 2 trotzdem setzen. Auf einem laufenden Stand ist der Patch
# ohne Wirkung, und ein kubectl scale von Hand wird bei jedem Lauf auf den
# Wert des Plays zurückgesetzt.
- name: Keycloak auf zwei Replicas setzen
  kubernetes.core.k8s:
    state: patched
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    kind: StatefulSet
    name: keycloak-keycloakx
    namespace: "{{ auth_namespace }}"
    definition:
      spec:
        replicas: 2

# Ingress nur von Traefik (#62). Steht nach dem Helm-Task, weil die Policy den
# Pod über app.kubernetes.io/name=keycloakx trifft und dieses Label erst mit
# dem StatefulSet entsteht. Und vor dem Wartetask darunter, damit der schon
# unter den Bedingungen wartet, die danach im Betrieb gelten.
- name: Keycloak NetworkPolicy anwenden
  kubernetes.core.k8s:
    state: present
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    definition: "{{ lookup('template', 'files/keycloak-networkpolicy.yaml') | from_yaml }}"

# Wie bei MongoDB und Valkey. Der Schritt steht außerhalb des Helm-Tasks,
# damit dessen retries das Warten auf die Bereitschaft nicht mitwiederholen.
# 420 Sekunden liegen über dem Startfenster der startupProbe von 315 Sekunden
# plus Scheduling und PVC-Anbindung, ein Pod scheitert also erst an der Probe
# und nicht vorher an diesem Timeout.
- name: Auf die Bereitschaft von Keycloak warten
  ansible.builtin.command:
    argv: [kubectl, rollout, status, statefulset/keycloak-keycloakx, -n, "{{ auth_namespace }}", --timeout=420s]
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  changed_when: false

# Das PVC der H2-Datei aus dem Stand vor #163. Nach dem Helm-Lauf, weil bis
# dahin die alte Pod-Vorlage noch darauf zeigt. Auf einem neuen Cluster fehlt
# es und absent ist ohne Wirkung.
- name: Altes PVC der H2-Datei entfernen
  kubernetes.core.k8s:
    state: absent
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    api_version: v1
    kind: PersistentVolumeClaim
    name: keycloak-data
    namespace: "{{ auth_namespace }}"

# Die ConfigMap gleichen Namens aus dem Stand vor dem Secret. Auf einem
# Cluster von davor bliebe sie sonst mit demselben Inhalt lesbar liegen. Erst
# hier, nach dem Helm-Lauf und der Bereitschaft: Bis dahin zeigt die
# Pod-Vorlage des StatefulSet noch auf die ConfigMap, und ein Pod, der in
# dieser Zeit neu entsteht, bliebe ohne sie in FailedMount hängen.
- name: Alte ConfigMap mit dem Realm-Import entfernen
  kubernetes.core.k8s:
    state: absent
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    api_version: v1
    kind: ConfigMap
    name: keycloak-realm-import
    namespace: "{{ auth_namespace }}"
