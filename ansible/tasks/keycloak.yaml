---
# Keycloak als einzelner Pod mit persistentem H2-Datenspeicher. Der Realm samt
# Gateway-Client und Test-Benutzer kommt als Code über --import-realm.
#
# H2 (database.vendor dev-file) statt einer externen Datenbank: ein zweiter Pod
# ist nicht vorgesehen, und die H2-Datei liegt auf einem PVC unter
# /opt/keycloak/data, überlebt den Pod-Neustart also (Abnahmepunkt 6). Eine
# externe Datenbank wäre erst ab dem zweiten Keycloak-Pod nötig.

- name: Namespace für die Auth-Dienste
  kubernetes.core.k8s:
    state: present
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ auth_namespace }}"

# Bootstrap-Admin nur für die Admin-Konsole. no_log, damit das Passwort nicht
# im Ansible-Protokoll steht.
- name: Secret mit dem Keycloak-Admin-Passwort
  kubernetes.core.k8s:
    state: present
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: keycloak-admin
        namespace: "{{ auth_namespace }}"
      type: Opaque
      stringData:
        KC_BOOTSTRAP_ADMIN_USERNAME: admin
        KC_BOOTSTRAP_ADMIN_PASSWORD: "{{ keycloak_admin_password }}"
  no_log: true

# H2 liegt hier. Ohne PVC legt Keycloak die Datei ins Container-Dateisystem und
# verliert Realm und Benutzer beim Ersetzen des Pods. StorageClass bleibt offen:
# die Rolle setzt auf dem Mehr-Node-Cluster Longhorn als Standard.
- name: PVC für den Keycloak-Datenspeicher
  kubernetes.core.k8s:
    state: present
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    definition:
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: keycloak-data
        namespace: "{{ auth_namespace }}"
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: "{{ keycloak_pvc_size }}"

# Der gerenderte Realm. Keycloak importiert beim Start alles aus
# data/import; die ConfigMap wird unten in genau dieses Verzeichnis gemountet.
- name: ConfigMap mit dem Realm-Import
  kubernetes.core.k8s:
    state: present
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: keycloak-realm-import
        namespace: "{{ auth_namespace }}"
      data:
        realm.json: "{{ lookup('template', 'templates/keycloak-realm.json.j2') }}"
  no_log: true

# retries, weil Helm den Chart bei jedem Lauf von github.com lädt und GitHub
# in Wellen Verbindungen abweist (beobachtet am 12. und 13.08.2026, betrifft
# alle Clients ohne eigene Wiederholung). Fünf Versuche mit 30 Sekunden
# Abstand überbrücken eine kurze Welle, im Erfolgsfall ändert sich nichts.
- name: Keycloak über Helm ausrollen
  register: keycloak_helm
  retries: 5
  delay: 30
  until: keycloak_helm is succeeded
  kubernetes.core.helm:
    name: keycloak
    chart_ref: keycloakx
    chart_repo_url: "{{ keycloak_chart_repo }}"
    chart_version: "{{ keycloak_chart_version }}"
    release_namespace: "{{ auth_namespace }}"
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    # Ohne Readiness-Probe gilt der Pod schon als bereit, sobald der Container
    # läuft -- wait wartet also nicht mehr auf den fertigen Realm-Import, sondern
    # nur darauf, dass der Pod planbar ist und startet.
    wait: false
    timeout: 15m0s
    values:
      replicas: 1
      image:
        tag: "{{ keycloak_image_tag }}"
      # Produktivmodus mit Import. dev-file als DB genügt für den einzelnen Pod.
      # --health-enabled lässt den /health-Endpunkt eingeschaltet. Die
      # Chart-Probes unten sind abgeschaltet und fragen ihn nicht ab, er bleibt
      # für Prüfungen von Hand erreichbar.
      command:
        - "/opt/keycloak/bin/kc.sh"
        - "start"
        - "--http-port=8080"
        - "--health-enabled=true"
        - "--import-realm"
      # Keine Probes. Der Chart rendert startup-, liveness- und readinessProbe
      # nur, wenn der jeweilige Wert gesetzt ist, leere Strings schalten sie
      # ab. Der /health-Endpunkt aus dem command bleibt bestehen, abgefragt
      # wird er nur von Hand.
      startupProbe: ""
      livenessProbe: ""
      readinessProbe: ""
      database:
        vendor: dev-file
      # Setzt KC_PROXY_HEADERS=forwarded und KC_HTTP_ENABLED=true, damit Keycloak
      # hinter Traefik die richtigen URLs bildet und intern über HTTP spricht.
      proxy:
        enabled: true
        mode: forwarded
        http:
          enabled: true
      # Ohne führenden /auth: der Issuer lautet dann
      # https://<host>/realms/<realm>, wie das Traefik-OIDC-Plugin ihn erwartet.
      http:
        relativePath: "/"
      # Feste öffentliche Adresse für die Token-Issuer-URL; hostname-strict aus,
      # damit interne Health-Checks über die Service-IP nicht daran scheitern.
      extraEnv: |
        - name: KC_HOSTNAME
          value: "https://{{ keycloak_host }}"
        - name: KC_HOSTNAME_STRICT
          value: "false"
        # Ohne JAVA_OPTS_KC_HEAP leitet kc.sh die Heap-Decke aus dem Limit ab,
        # beim Limit von 1152Mi wären das rund 806Mi. Die 512Mi wählt kc.sh
        # außerhalb eines Containers selbst, sie liegen über dem unter Last
        # belegten Heap von 299Mi. Die Variable ersetzt nur die drei
        # Prozentsatz-Flags, MaxMetaspaceSize bleibt stehen. Der Initial-Heap
        # von 256Mi spart gegenüber 512Mi rund 180Mi im Spitzenwert und kostet
        # Durchsatz, gemessen in einem Gegenlauf zu #165.
        - name: JAVA_OPTS_KC_HEAP
          value: "-Xms256m -Xmx512m"
      extraEnvFrom: |
        - secretRef:
            name: keycloak-admin
      # PVC auf data, die Realm-ConfigMap überlagert nur das Unterverzeichnis
      # import. Kubernetes erlaubt den verschachtelten Mount.
      extraVolumes: |
        - name: data
          persistentVolumeClaim:
            claimName: keycloak-data
        - name: realm-import
          configMap:
            name: keycloak-realm-import
      extraVolumeMounts: |
        - name: data
          mountPath: /opt/keycloak/data
        - name: realm-import
          mountPath: /opt/keycloak/data/import
          readOnly: true
      # Gemessen mit app/anmeldelast.py, das echte Anmeldungen über den
      # Authorization-Code-Flow fährt. Der Client judge-gateway erlaubt keine
      # Direktvergabe. Zehn Läufe am 22. und 23.08. mit zusammen 22838
      # Anmeldungen, keiner davon hat den Pod umgeworfen.
      #
      # Der Request von 832Mi deckt den Spitzenwert von 707Mi und lässt
      # Reserve für das Nachrücken. Die JVM gibt einmal belegten Speicher
      # nicht zurück, der Pod bleibt auch nach den Läufen bei 706Mi. Die
      # bisherigen 512Mi lagen unter dem Verbrauch, siehe #161.
      #
      # Das Limit von 1152Mi deckt den ungünstigen Fall. Heap-Decke 512Mi,
      # MaxMetaspaceSize 256Mi, Code-Cache im beobachteten Höchststand 73Mi
      # und 214Mi daneben ergeben 1055Mi. Vor #165 waren es 1281Mi gegen ein
      # Limit von 1024Mi. Ein Limit wird auf dem Node nicht reserviert,
      # geplant wird mit dem Request.
      #
      # Die CPU liegt im Leerlauf bei 2m. Unter Last steht sie am Limit, in
      # einem Lauf über 120 Sekunden waren 1156 von 1205 Perioden gedrosselt.
      # Eine Anmeldung kostet dabei 59 Kern-Millisekunden. Diese 17 je Sekunde
      # sind der ausgereizte Testfall und nicht der Betrieb. Ein Kurs meldet
      # sich stoßweise an und bleibt danach angemeldet, gebraucht wird weit
      # weniger als eine Anmeldung je Sekunde. Rechnerisch entsprechen die
      # 250m gut vier je Sekunde, das Limit von 1000m lässt die gemessenen 17
      # zu.
      resources:
        requests:
          cpu: "250m"
          memory: "832Mi"
        limits:
          cpu: "1000m"
          memory: "1152Mi"
      # DNS und Wildcard-TLS kommen automatisch von external-dns und cert-manager
      # der Rolle, sobald der Host unter der eigenen Zone liegt.
      ingress:
        enabled: true
        rules:
          - host: "{{ keycloak_host }}"
            paths:
              - path: "/"
                pathType: Prefix
        tls:
          - hosts:
              - "{{ keycloak_host }}"
