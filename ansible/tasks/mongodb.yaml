# === MongoDB NetworkPolicy ===
# Die Policies stehen vor der Installation, damit der Operator und die drei
# Pods schon beim ersten Aufbau unter den Bedingungen anlaufen, die später im
# Betrieb gelten. Stünden sie dahinter, würde der Wartetask unten einen Stand
# abnehmen, den es danach nicht mehr gibt, und ein Fehler in einer Regel fiele
# erst beim nächsten Neustart auf -- kube-router lässt bestehende
# Verbindungen im Zustand ESTABLISHED durch.

# Die Adresse des API-Servers aus dem Cluster statt aus dem Inventar. Der
# Inventar-Hostname ist die SSH-Adresse, hier zufällig dieselbe; die Policy
# braucht die Adresse, unter der der API-Server tatsächlich erreichbar ist.
# Endpoints ist ab v1.33 als veraltet markiert, funktioniert aber weiter --
# der Nachfolger wäre EndpointSlice.
- name: Adresse des API-Servers ermitteln
  kubernetes.core.k8s_info:
    kind: Endpoints
    name: kubernetes
    namespace: default
    kubeconfig: "{{ kubeconfig_root }}"
  register: api_endpunkt

- name: NetworkPolicy für den MongoDB-Operator anwenden
  kubernetes.core.k8s:
    state: present
    kubeconfig: "{{ kubeconfig_root }}"
    definition: "{{ lookup('template', 'files/mongodb-operator-networkpolicy.yaml') | from_yaml }}"

- name: NetworkPolicy für MongoDB anwenden
  kubernetes.core.k8s:
    state: present
    kubeconfig: "{{ kubeconfig_root }}"
    definition: "{{ lookup('template', 'files/mongodb-networkpolicy.yaml') | from_yaml }}"

# === MongoDB Operator ===
- name: MongoDB-Helm-Repository hinzufügen
  kubernetes.core.helm_repository:
    name: mongodb
    repo_url: https://mongodb.github.io/helm-charts

- name: MongoDB-Operator über Helm ausrollen
  kubernetes.core.helm:
    name: community-operator
    chart_ref: mongodb/community-operator
    chart_version: "0.13.0"
    release_namespace: "{{ app_namespace }}"
    wait: true
    kubeconfig: "{{ kubeconfig_root }}"
    values:
      operator:
        # Ohne diesen Block gelten die Vorgaben des Charts mit 500m und
        # 200Mi als Request, und der Operator hielte damit mehr CPU fest als
        # die drei mongod zusammen. Gemessen am 22.08. mit kubectl top pod
        # --containers, unter Last aus app/chart/lastgenerator.py mit 15
        # Einreichungen je Sekunde über 180 Sekunden, bleibt er bei 1m und
        # 15Mi und damit auf dem Wert aus dem Leerlauf. Das ist erwartbar,
        # denn er gleicht nur die MongoDBCommunity mit dem StatefulSet ab und
        # sieht die Einreichungen gar nicht.
        #
        # Seine Arbeit hängt am Abgleich und nicht an der Last, und die Spitze
        # steht deshalb beim Ausrollen. Im selben Zeitraum gemessen sind 10m
        # und 16Mi, während er startet und den StatefulSet neu schreibt,
        # danach fällt er auf 1m zurück. 50m und 64Mi liegen darüber. Das
        # Limit lässt Luft für einen Abgleich, der länger braucht, ohne dass
        # ein hängender Operator einen Node leerräumt.
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"

# Das Chart 0.13.0 rendert keinen nodeSelector, weder unter operator noch auf
# oberster Ebene, deshalb der Patch danach. Helm überschreibt ihn bei jedem
# Upgrade, und dieser Task setzt ihn im selben Lauf wieder.
- name: Operator an die Dienste-Nodes binden
  kubernetes.core.k8s:
    state: patched
    kubeconfig: "{{ kubeconfig_root }}"
    kind: Deployment
    namespace: "{{ app_namespace }}"
    name: mongodb-kubernetes-operator
    definition:
      spec:
        template:
          spec:
            nodeSelector:
              online-judge/rolle: dienste

# === MongoDB Instance ===
- name: MongoDB-Passwort-Secret anwenden
  kubernetes.core.k8s:
    state: present
    kubeconfig: "{{ kubeconfig_root }}"
    definition: "{{ lookup('template', 'files/mongodb-password.yaml') | from_yaml }}"

- name: MongoDB-Instanz anwenden
  kubernetes.core.k8s:
    state: present
    kubeconfig: "{{ kubeconfig_root }}"
    definition: "{{ lookup('template', 'files/mongodb-instance.yaml') | from_yaml }}"

# === MongoDB Wait ===
- name: Auf das MongoDB-StatefulSet warten
  kubernetes.core.k8s_info:
    kind: StatefulSet
    name: mongodb
    namespace: "{{ app_namespace }}"
    kubeconfig: "{{ kubeconfig_root }}"
    wait: true
    wait_timeout: 300

- name: Auf Bereitschaft von MongoDB warten
  ansible.builtin.command:
    argv: [kubectl, rollout, status, statefulset/mongodb, -n, "{{ app_namespace }}", --timeout=300s]
  environment:
    KUBECONFIG: "{{ kubeconfig_root }}"
  changed_when: false
