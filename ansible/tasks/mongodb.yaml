# === MongoDB Operator ===
- name: Add MongoDB Helm repository
  kubernetes.core.helm_repository:
    name: mongodb
    repo_url: https://mongodb.github.io/helm-charts

- name: Install MongoDB operator
  kubernetes.core.helm:
    name: community-operator
    chart_ref: mongodb/community-operator
    chart_version: "0.13.0"
    release_namespace: "{{ app_namespace }}"
    wait: true
    kubeconfig: "{{ kubeconfig_root }}"
    values:
      operator:
        # Ohne diesen Block gelten die Vorgaben des Charts mit 500m und
        # 200Mi als Request, und der Operator hielte damit mehr CPU fest als
        # die drei mongod zusammen. Gemessen am 22.08. mit kubectl top pod
        # --containers, unter Last aus app/chart/lastgenerator.py mit 15
        # Einreichungen je Sekunde über 180 Sekunden, bleibt er bei 1m und
        # 15Mi und damit auf dem Wert aus dem Leerlauf. Das ist erwartbar,
        # denn er gleicht nur die MongoDBCommunity mit dem StatefulSet ab und
        # sieht die Einreichungen gar nicht.
        #
        # Seine Arbeit hängt am Abgleich und nicht an der Last, und die Spitze
        # steht deshalb beim Ausrollen. Im selben Zeitraum gemessen sind 10m
        # und 16Mi, während er startet und den StatefulSet neu schreibt,
        # danach fällt er auf 1m zurück. 50m und 64Mi liegen darüber. Das
        # Limit lässt Luft für einen Abgleich, der länger braucht, ohne dass
        # ein hängender Operator einen Node leerräumt.
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"

# Das Chart 0.13.0 rendert keinen nodeSelector, weder unter operator noch auf
# oberster Ebene, deshalb der Patch danach. Helm überschreibt ihn bei jedem
# Upgrade, und dieser Task setzt ihn im selben Lauf wieder.
- name: Operator an die Dienste-Nodes binden
  kubernetes.core.k8s:
    state: patched
    kubeconfig: "{{ kubeconfig_root }}"
    kind: Deployment
    namespace: "{{ app_namespace }}"
    name: mongodb-kubernetes-operator
    definition:
      spec:
        template:
          spec:
            nodeSelector:
              online-judge/rolle: dienste

# === MongoDB Instance ===
- name: Apply MongoDB password Secret
  kubernetes.core.k8s:
    state: present
    kubeconfig: "{{ kubeconfig_root }}"
    definition: "{{ lookup('template', 'files/mongodb-password.yaml') | from_yaml }}"

- name: Apply MongoDB Instance
  kubernetes.core.k8s:
    state: present
    kubeconfig: "{{ kubeconfig_root }}"
    definition: "{{ lookup('template', 'files/mongodb-instance.yaml') | from_yaml }}"

# === MongoDB Wait ===

- name: Wait for MongoDB StatefulSet to exist
  kubernetes.core.k8s_info:
    kind: StatefulSet
    name: mongodb
    namespace: "{{ app_namespace }}"
    kubeconfig: "{{ kubeconfig_root }}"
    wait: true
    wait_timeout: 300

- name: Wait for MongoDB to be ready
  ansible.builtin.command:
    argv: [kubectl, rollout, status, statefulset/mongodb, -n, "{{ app_namespace }}", --timeout=300s]
  environment:
    KUBECONFIG: "{{ kubeconfig_root }}"
  changed_when: false
