---
- name: Namespace für die Anwendung
  kubernetes.core.k8s:
    state: present
    kubeconfig: "{{ kubeconfig_root }}"
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ app_namespace }}"

- name: Default-deny für eingehenden Verkehr
  kubernetes.core.k8s:
    state: present
    kubeconfig: "{{ kubeconfig_root }}"
    definition: "{{ lookup('template', 'files/judge-networkpolicy.yaml') | from_yaml }}"
