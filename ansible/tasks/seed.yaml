---
# Der Seed der Aufgaben. Worker, Rückhol-CronJob und ScaledObject liegen seit
# dem Umzug im Chart (app/chart/templates/judge.yaml) und kommen mit dem Tag
# app. Hier bleibt, was Dateien aus dem Repo braucht. laden.py und die
# Aufgaben-JSONs liegen nicht im Worker-Image, der Build-Kontext ist
# app/worker, deshalb gehen sie als ConfigMap in den Cluster und ein Job führt
# das Skript aus dem Mount aus. laden.py liest die JSONs aus seinem eigenen
# Verzeichnis, der Mount unter /seed genügt also.

- name: Aufgaben und Seed-Skript einsammeln
  ansible.builtin.set_fact:
    seed_daten: "{{ (seed_daten | default({})) | combine({item | basename: lookup('file', item)}) }}"
  loop: "{{ (lookup('fileglob', playbook_dir ~ '/../app/aufgaben/*.json', wantlist=True) + [playbook_dir ~ '/../app/aufgaben/laden.py']) | sort }}"
  loop_control:
    label: "{{ item | basename }}"

- name: ConfigMap mit den Aufgaben und dem Seed-Skript
  kubernetes.core.k8s:
    state: present
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: aufgaben-seed
        namespace: default
      data: "{{ seed_daten }}"

# Jobs sind nach dem Anlegen unveränderlich, ein geänderter Seed braucht
# deshalb einen frischen Job. laden.py ist idempotent, der Titel ist der
# Schlüssel, ein zweiter Lauf aktualisiert statt zu doppeln.
- name: Alten Seed-Job entfernen
  kubernetes.core.k8s:
    state: absent
    api_version: batch/v1
    kind: Job
    name: aufgaben-seed
    namespace: default
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    wait: true

- name: Seed-Job ausführen
  kubernetes.core.k8s:
    state: present
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    wait: true
    wait_condition:
      type: Complete
      status: "True"
    wait_timeout: 300
    definition:
      apiVersion: batch/v1
      kind: Job
      metadata:
        name: aufgaben-seed
        namespace: default
      spec:
        backoffLimit: 2
        template:
          spec:
            restartPolicy: Never
            containers:
              - name: seed
                # Dasselbe Image wie der Worker, pymongo liegt dort schon.
                # Ein eigenes Seed-Image wäre ein weiterer Build für ein
                # Skript. Der Tag kommt aus vars/app.yaml, damit Seed und
                # Worker denselben Stand fahren.
                image: "ghcr.io/litithio/online-judge-worker:{{ app_image_tag }}"
                command: ["python", "/seed/laden.py"]
                env:
                  - name: MONGO_URI
                    valueFrom:
                      secretKeyRef:
                        name: mongodb-coding-platform-app
                        key: connectionString.standard
                volumeMounts:
                  - name: seed
                    mountPath: /seed
                    readOnly: true
            volumes:
              - name: seed
                configMap:
                  name: aufgaben-seed

# Einmalige Migration für #113 (app/worker/nachtrag_113.py). Anders als der
# Seed kein ConfigMap-Umweg nötig: das Skript liegt schon im Worker-Image
# (COPY . . in app/worker/Dockerfile), der Job ruft es direkt unter /app auf.
- name: Alten Nachtrag-Job entfernen
  kubernetes.core.k8s:
    state: absent
    api_version: batch/v1
    kind: Job
    name: nachtrag-113
    namespace: default
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    wait: true

- name: "Nachtrag-Job für #113 ausführen"
  kubernetes.core.k8s:
    state: present
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    wait: true
    wait_condition:
      type: Complete
      status: "True"
    wait_timeout: 300
    definition:
      apiVersion: batch/v1
      kind: Job
      metadata:
        name: nachtrag-113
        namespace: default
      spec:
        backoffLimit: 2
        template:
          spec:
            restartPolicy: Never
            containers:
              - name: nachtrag-113
                image: "ghcr.io/litithio/online-judge-worker:{{ app_image_tag }}"
                command: ["python", "/app/nachtrag_113.py"]
                env:
                  - name: MONGO_URI
                    valueFrom:
                      secretKeyRef:
                        name: mongodb-coding-platform-app
                        key: connectionString.standard
