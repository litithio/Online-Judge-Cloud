# === Valkey ===
# Kein Operator wie bei MongoDB: Valkey ist hier reiner Transport für IDs,
# ohne Anspruch auf Wahrheit, ein einzelner Pod reicht (#82).
#
# definition mit lookup('template', ...) statt src: src würde die Datei auf
# dem Zielhost suchen, auf dem dieser Task läuft (judge_k3s_server), dort
# liegt sie nicht. lookup('template', ...) liest dagegen auf dem
# Kontrollknoten und löst dabei {{ app_namespace }} auf, genau wie in
# tasks/mongodb.yaml.
- name: Valkey PVC anwenden
  kubernetes.core.k8s:
    state: present
    kubeconfig: "{{ kubeconfig_root }}"
    definition: "{{ lookup('template', 'files/valkey-pvc.yaml') | from_yaml }}"

# Die lokale Datei trägt nur password. connectionString entsteht hier aus
# demselben Wert, sonst müsste das Passwort an zwei Stellen gepflegt werden
# und nichts würde auffallen, wenn sie auseinanderlaufen. Percent-Encoding,
# weil redis-py die URI mit urllib zerlegt, ein "/", "#" oder "?" im
# Passwort würde sonst die URI an dieser Stelle beenden. urlencode lässt "/"
# stehen, deshalb das zusätzliche replace.
- name: Valkey-Passwort-Secret anwenden
  vars:
    valkey_secret: "{{ lookup('template', 'files/valkey-password.yaml') | from_yaml }}"
    valkey_passwort_uri: "{{ valkey_secret.stringData.password | urlencode | replace('/', '%2F') }}"
  kubernetes.core.k8s:
    state: present
    kubeconfig: "{{ kubeconfig_root }}"
    definition: "{{ valkey_secret | combine({'stringData': {'connectionString': 'redis://:' ~ valkey_passwort_uri ~ '@valkey:6379'}}, recursive=True) }}"

- name: Valkey Deployment anwenden
  kubernetes.core.k8s:
    state: present
    kubeconfig: "{{ kubeconfig_root }}"
    definition: "{{ lookup('template', 'files/valkey-deployment.yaml') | from_yaml }}"

- name: Valkey Service anwenden
  kubernetes.core.k8s:
    state: present
    kubeconfig: "{{ kubeconfig_root }}"
    definition: "{{ lookup('template', 'files/valkey-service.yaml') | from_yaml }}"

- name: Warten, bis Valkey bereit ist
  ansible.builtin.command:
    argv: [kubectl, rollout, status, deployment/valkey, -n, "{{ app_namespace }}", --timeout=300s]
  environment:
    KUBECONFIG: "{{ kubeconfig_root }}"
  changed_when: false
