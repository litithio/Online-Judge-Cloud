---
# sleep 10 statt des Standards von einer Sekunde: Sekündliche Versuche auf
# mehrere Hosts sehen für ein IDS wie ein Portscan aus und haben Port 22
# einzelner Nodes zeitweise für die Absenderadresse gesperrt.
- name: Auf SSH warten
  ansible.builtin.wait_for_connection:
    timeout: 300
    sleep: 10

# raw statt eines Moduls, weil zu diesem Zeitpunkt noch kein Python auf der
# Node vorausgesetzt werden kann.
- name: Auf cloud-init warten
  ansible.builtin.raw: cloud-init status --wait
  changed_when: false
