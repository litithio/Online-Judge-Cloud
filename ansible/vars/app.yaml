# Konfiguration des App-Deployments (Issue #15/#17). Von Hand gepflegt, keine
# Secrets: die App liest ihre Identität aus den Gateway-Headern, die Queue läuft
# ohne Anmeldung im selben Namespace, und die MongoDB-Zugangsdaten liest das
# Chart aus dem Operator-Secret. Die Anbindung steht als Vorgabe im Chart
# (values.yaml, externe).

---
# Namespace der Anwendung. judge statt default, damit Anwendung, Datendienste
# und Keycloak zusammen in einem eigenen Namespace liegen und default leer
# bleibt (#62). Einen Altbestand in default räumt der Lauf nicht ab. Middleware
# und geschützte Ingress (tasks/traefik-auth.yaml) folgen der Variable.
app_namespace: judge

# Welche values-Datei überlagert die Vorgaben: values-prod.yaml oder
# values-dev.yaml. Das Deployment auf dem Kurs-Cluster ist prod.
app_values_env: prod

# Image-Tag von API, Worker und Durchlauf. Das Chart nimmt ihn für alle drei,
# der Seed-Job in tasks/seed.yaml ebenso. Fester Stand statt latest, gebaut
# von .github/workflows/images.yml bei einem Git-Tag.
#
# Gelesen aus appVersion in app/chart/Chart.yaml statt hier wiederholt. Zwei
# Stellen mit derselben Version driften auseinander, und helm list zeigte
# dann einen Stand, der nicht läuft. Der lookup läuft auf dem Steuerrechner,
# dort liegt das Repo. Das Chart-Schema lehnt einen leeren Tag weiter ab.
app_image_tag: "{{ (lookup('file', playbook_dir ~ '/../app/chart/Chart.yaml') | from_yaml).appVersion }}"

# Auf den Server kopierter Chart. Die Helm-Module laufen dort (kubeconfig liegt
# auf dem Server), der Chart muss also neben ihnen liegen, nicht nur auf dem
# Steuerrechner.
app_chart_remote: /opt/online-judge/chart
