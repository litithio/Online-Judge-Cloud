# Chart der eigenen Dienste, Issue #15. Es rollt die API (backend) und die
# Judge-Kette aus, also die Worker je Sprache, ihre ScaledObjects und den
# Rückhol-CronJob. MongoDB, Valkey und der Seed der Aufgaben stehen als
# Infrastruktur schon im Cluster, das Chart verbindet sich mit den
# Datendiensten nur über die Adressen aus values. Keycloak und die
# Traefik-Anbindung bleiben ebenfalls außerhalb, sie gehören zur Auth-Kette
# (Issue #20) und Ansible rollt sie getrennt aus, damit ihre Secrets nicht
# durch die App-values laufen.
apiVersion: v2
name: online-judge
description: Die eigenen Dienste des Online Judge, API und Judge-Kette
type: application
# version ist die Chart-Version, appVersion der Stand der Anwendung, beide von
# Hand gepflegt. appVersion ist die einzige Stelle mit dem laufenden Stand,
# ansible/vars/app.yaml liest den Wert von hier und reicht ihn als image.tag
# an Helm und den Seed-Job durch.
version: 0.2.0
appVersion: "0.2.12"
