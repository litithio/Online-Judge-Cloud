# Die API. Tritt an die Stelle des Compose-Dienstes backend, kein Port nach
# außen, sondern ein Service, den die geschützte Ingress der Auth-Kette
# (ansible/tasks/traefik-auth.yaml) anspricht. Von außen führt der Weg über
# Traefik -> Middleware -> diesen Service.
#
# Keine eigene ConfigMap: die einzige Konfiguration der API ist REDIS_URI,
# und die enthält seit #61 ein Passwort, sie steht deshalb unten direkt als
# secretKeyRef.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    {{- include "online-judge.labels" . | nindent 4 }}
    app: backend
spec:
  replicas: {{ .Values.backend.replicas }}
  # maxUnavailable 1 statt der Vorgabe. Kubernetes rundet die 25 Prozent bei
  # zwei Replicas auf null ab, dann darf kein alter Pod weichen, bevor der neue
  # läuft. Der neue braucht wegen der Anti-Affinity unten aber einen Node ohne
  # backend-Pod, und fehlt der, steht der Rollout still. Mit 1 läuft er auch
  # auf zwei Nodes durch. In prod fällt die Verfügbarkeit dabei gemessen auf
  # eine Replica und nie auf null, der Rollout nimmt die API also nicht aus dem
  # Service. Redundanz hat sie in diesem Fenster keine mehr. In dev mit einer
  # Replica fällt sie kurz auf null. Beides steht im README unter ## Grenzen.
  #
  # maxSurge bleibt bei der Vorgabe. Für die Verfügbarkeit macht ein maxSurge 0
  # keinen Unterschied, gemessen steht in beiden Fällen kurz nur eine Replica
  # im Service, weil der Controller das Budget aus maxUnavailable ausnutzt. Es
  # spart nur den dritten Pod für ein paar Sekunden.
  #
  # Läuft ein Rollout nicht durch, bleibt eine Replica weg. Der Controller hat
  # sie dann schon entfernt und holt sie nicht zurück. Siehe README
  # ## Grenzen.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        {{- include "online-judge.labels" . | nindent 8 }}
        app: backend
    spec:
      # Die API spricht nicht mit der Kubernetes-API. Ohne diese Zeile mountet
      # kubelet trotzdem ein Token des ServiceAccounts default in den Pod, und
      # der Judge-Worker verzichtet aus demselben Grund schon darauf.
      automountServiceAccountToken: false
      # Wie die Datendienste auf die Dienste-Nodes. Die API hält zwar nichts auf
      # Platte, aber die Zugangsdaten zu MongoDB und die Identität, die das
      # Gateway ihr in den Headern übergibt. Die Trennung aus #88 gilt in beide
      # Richtungen, und ohne diesen Selector landen beide Replicas auf den
      # Judge-Nodes, gemessen am 25.08.
      nodeSelector:
        online-judge/rolle: dienste
      # Die Replicas der API müssen auf verschiedenen Nodes liegen. In prod sind
      # es zwei. Liegen beide auf demselben Node, nimmt ein Ausfall die ganze
      # API mit, und die zweite Replica zahlt nicht auf P5 ein. required und
      # nicht preferred, weil preferred einen Node ohne backend-Pod nur besser
      # bewertet und nichts zusagt (Beschluss in #88).
      #
      # Der neue Pod eines Rollouts braucht deshalb einen Node ohne
      # backend-Pod. Was passiert, wenn keiner frei ist, steht am strategy-Block
      # oben.
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: backend
              topologyKey: kubernetes.io/hostname
      containers:
        - name: backend
          image: {{ include "online-judge.image" (dict "root" . "repo" .Values.backend.repository) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8000
          env:
            # Der Operator schreibt die Mongo-URI in sein Secret.
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.externe.mongoSecrets.backend.name | quote }}
                  key: {{ .Values.externe.mongoSecrets.backend.key | quote }}
            # Die Valkey-URI liegt im manuell gepflegten Pendant, angelegt von
            # ansible/tasks/valkey.yaml (#61).
            - name: REDIS_URI
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.externe.redisSecret.name | quote }}
                  key: {{ .Values.externe.redisSecret.key | quote }}
            # Keine KEYCLOAK_URL. Die Identität prüft das Gateway, die App liest
            # sie aus den X-Auth-Request-*-Headern (app/backend/auth.py).
            #
            # Der Herkunftswert liegt im Secret und nicht in der ConfigMap, und
            # er steht aus demselben Grund nicht in den values. Sonst schriebe
            # ihn Helm in seine Historie.
            - name: GATEWAY_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.externe.gatewaySecret.name | quote }}
                  key: {{ .Values.externe.gatewaySecret.key | quote }}
          # /healthz hängt an keinem anderen Dienst, /readyz prüft MongoDB.
          # Deshalb startet ein Datenbankausfall keine Pods neu, er nimmt sie
          # nur aus dem Service. Ohne readiness bekäme ein frischer Pod beim
          # Rolling Update sofort Anfragen, auch wenn er MongoDB noch nicht
          # erreicht (P5, Update ohne Ausfall).
          #
          # Die startupProbe gibt dem Start bis zu 60 Sekunden. Die Indizes
          # entstehen in einem eigenen Thread (main.py), der Start wartet
          # nicht mehr auf MongoDB. Gemessen braucht er bis zur ersten
          # Antwort auf /healthz rund 26 Sekunden, wenn ein voller Knoten
          # den Pod auf seinen CPU-Request drückt. Das Fenster ist gut das
          # Doppelte, Herleitung im README unter Startfenster der API.
          startupProbe:
            httpGet:
              path: /healthz
              port: 8000
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          # Häufiger als die liveness: ein Pod, der die Datenbank wieder
          # erreicht, soll schnell zurück in den Service.
          #
          # timeoutSeconds 3, nicht 2: Bei nicht erreichbarer MongoDB antwortet
          # /readyz gemessen nach 2,5 Sekunden mit 503. Mit einem Limit von 2
          # liefe die Probe in ihr eigenes Zeitlimit und der Grund stünde
          # nirgends.
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  labels:
    {{- include "online-judge.labels" . | nindent 4 }}
    app: backend
spec:
  selector:
    app: backend
  ports:
    - port: 8000
      targetPort: 8000

---
# Ingress nur von Traefik (#62). Der Weg von außen führt über Traefik ->
# Middleware -> diesen Service, ein anderer Absender ist nicht vorgesehen.
# Kein Egress-Block: der bleibt offen, bis die Egress-Regeln stehen.
#
# Der Lastgenerator ist davon ausgesperrt. Er läuft laut seinem Docstring
# auf dem Server-Node gegen die Service-IP, nicht als Pod, und fällt damit
# unter keinen Selektor. Offener Punkt in #62.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend
  labels:
    {{- include "online-judge.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: backend
  policyTypes:
    - Ingress
  ingress:
    - from:
        # Pods aus diesem Chart: Backend untereinander (der Node-übergreifende
        # Test in scripts/smoke.sh) und die Helm-Testpods. Enger als der ganze
        # Namespace, MongoDB, Valkey und Keycloak sind nicht drin. part-of und
        # nicht instance, weil instance der Release-Name ist.
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: online-judge
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 8000
