# Die API. Tritt an die Stelle des Compose-Dienstes backend, kein Port nach
# außen, sondern ein Service, den die geschützte Ingress der Auth-Kette
# (ansible/tasks/traefik-auth.yaml) anspricht. Von außen führt der Weg über
# Traefik -> Middleware -> diesen Service.
#
# Die nicht geheime Konfiguration steht in einer eigenen ConfigMap je
# Komponente. Eine gemeinsame würde jedem Workload die Werte der anderen
# unterschieben.
{{- $daten := dict "REDIS_URI" (include "online-judge.redisUri" .) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend
  labels:
    {{- include "online-judge.labels" . | nindent 4 }}
data:
  {{- toYaml $daten | nindent 2 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    {{- include "online-judge.labels" . | nindent 4 }}
    app: backend
spec:
  replicas: {{ .Values.backend.replicas }}
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      annotations:
        # Prüfsumme über die Daten der ConfigMap. envFrom liest sie beim Start
        # des Pods, ohne diese Annotation liefe ein geänderter Wert erst beim
        # nächsten Neustart an, und niemand sähe warum.
        checksum/config: {{ toYaml $daten | sha256sum }}
      labels:
        {{- include "online-judge.labels" . | nindent 8 }}
        app: backend
    spec:
      containers:
        - name: backend
          image: {{ include "online-judge.image" (dict "root" . "repo" .Values.backend.repository) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: backend
          env:
            # Getrennt von der ConfigMap, weil die URI das Passwort enthält.
            # Der Operator schreibt sie in das Secret.
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.externe.mongoSecret.name | quote }}
                  key: {{ .Values.externe.mongoSecret.key | quote }}
            # Keine KEYCLOAK_URL. Die Identität prüft das Gateway, die App liest
            # sie aus den X-Auth-Request-*-Headern (app/backend/auth.py).
          # /healthz hängt an keinem anderen Dienst, /readyz prüft MongoDB.
          # Deshalb startet ein Datenbankausfall keine Pods neu, er nimmt sie
          # nur aus dem Service. Ohne readiness bekäme ein frischer Pod beim
          # Rolling Update sofort Anfragen, auch wenn er MongoDB noch nicht
          # erreicht (P5, Update ohne Ausfall).
          #
          # Die startupProbe gibt dem Start bis zu 120 Sekunden. Das Fenster
          # ist seit #108 nur noch Reserve für einen langsamen Prozessstart:
          # Die Indizes entstehen in einem eigenen Thread (main.py), der
          # Start wartet nicht mehr auf MongoDB.
          startupProbe:
            httpGet:
              path: /healthz
              port: 8000
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          # Häufiger als die liveness: ein Pod, der die Datenbank wieder
          # erreicht, soll schnell zurück in den Service.
          #
          # timeoutSeconds 3, nicht 2: Bei nicht erreichbarer MongoDB antwortet
          # /readyz gemessen nach 2,5 Sekunden mit 503. Mit einem Limit von 2
          # liefe die Probe in ihr eigenes Zeitlimit und der Grund stünde
          # nirgends.
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  labels:
    {{- include "online-judge.labels" . | nindent 4 }}
    app: backend
spec:
  selector:
    app: backend
  ports:
    - port: 8000
      targetPort: 8000
