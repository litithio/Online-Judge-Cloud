# Die Judge-Kette. Je Sprache ein Worker-Deployment mit dem passenden
# ScaledObject, dazu der Rückhol-CronJob für alle Sprachen. Im Chart statt in
# eigenen Manifesten, damit die Image-Tags an derselben Stelle stehen wie die
# der API und eine zweite Sprache ein Eintrag in values ist statt einer
# weiteren Datei.
# Das Kommando beider Probes am Worker. Ein Shell-Test und kein Python-Aufruf:
# Die Probe läuft im cgroup des Workers, und dort sättigt eine Einreichung den
# einen Kern, den das Limit in values erlaubt. Ein zweiter Python-Interpreter
# nähme ihr Rechenzeit weg, während ihre Frist über die vergangene Zeit
# weiterläuft, und schöbe einen knappen korrekten Lauf Richtung TLE. sh, date
# und stat kosten Millisekunden. Sie liegen alle im Image, es ist Debian-basiert.
#
# Das -ge 0 fängt eine Uhr ab, die rückwärts gestellt wurde. Die mtime läge dann
# in der Zukunft, das Alter wäre negativ und jeder Vergleich nach oben ginge
# durch, auch für einen längst eingefrorenen Worker. Ein Fehlschlag ist hier das
# richtige Ergebnis, der Neustart macht die Datei frisch und die Messung wieder
# brauchbar. Einen Sprung nach vorn fängt das nicht, siehe README ## Grenzen.
{{- $heartbeat := printf "alter=$(( $(date +%%s) - $(stat -c %%Y /run/heartbeat) )); test $alter -ge 0 && test $alter -lt %d" (int .Values.judge.heartbeatFrist) }}
{{- range .Values.judge.sprachen }}
# Die Konfiguration dieses Workers. WORKER_SPRACHE bestimmt, welche Liste er
# abfragt (judge:<sprache>) und worauf sein ScaledObject weiter unten zielt.
# SANDBOX_NETZ_ERZWINGEN gibt dem eingereichten Code einen eigenen
# Netz-Namespace, anders als im lokalen Compose-Stand. Ohne den Schalter würde
# die Trennung stillschweigend wegfallen, sobald der Aufruf einmal nicht
# durchgeht, und Einreichungen erreichten wieder die Datenbank.
{{- $daten := dict "REDIS_URI" (include "online-judge.redisUri" $) "WORKER_SPRACHE" .name "SANDBOX_NETZ_ERZWINGEN" "1" }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: code-worker-{{ .name }}
  labels:
    {{- include "online-judge.labels" $ | nindent 4 }}
data:
  {{- toYaml $daten | nindent 2 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: code-worker-{{ .name }}
  labels:
    {{- include "online-judge.labels" $ | nindent 4 }}
    app: code-worker-{{ .name }}
spec:
  # Ohne replicas, die Zahl gehört dem ScaledObject unten. Stünde sie hier,
  # setzte jedes helm upgrade den Stand zurück, den KEDA gerade eingestellt hat.
  #
  # maxSurge 0 statt der Vorgabe. Auf den Worker zeigt kein Service, er holt
  # seine Arbeit aus der Warteschlange, ein zusätzlicher Pod während des
  # Rollouts bringt nichts. Bei keda.max 5 ergäben die vorgegebenen 25 Prozent
  # aufgerundet zwei zusätzliche Pods, zusammen 7000m auf zwei Judge-Nodes mit
  # 8000m. Terminierende Pods halten ihre Anforderung dabei weiter, ein Rollout
  # unter Last ließe Worker deshalb Pending stehen. Beide Werte auf 0 lässt die
  # API nicht zu, deshalb maxUnavailable 1.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: code-worker-{{ .name }}
  template:
    metadata:
      annotations:
        # Prüfsumme über die Daten der ConfigMap. envFrom liest sie beim Start
        # des Pods, ohne diese Annotation liefe ein geänderter Wert erst beim
        # nächsten Neustart an.
        checksum/config: {{ toYaml $daten | sha256sum }}
      labels:
        {{- include "online-judge.labels" $ | nindent 8 }}
        app: code-worker-{{ .name }}
        # Trägt jeder Worker, unabhängig von der Sprache. Die Verteilungsregel
        # unten zählt darüber, denn die Worker aller Sprachen teilen sich
        # dieselben Kerne auf den Judge-Nodes. Über app allein zählte sie nur
        # je Sprache, und der erste Python- und der erste Java-Worker könnten
        # auf demselben Node landen, während der andere leer steht.
        komponente: judge-worker
    spec:
      # Der eingereichte Code läuft als Subprozess im Worker, nicht in einem
      # eigenen Container. Die Isolation kommt deshalb von der Laufzeit des
      # Worker-Pods selbst. runsc liegt auf den Agent-Nodes, die RuntimeClass
      # legt ansible/deploy.yaml an.
      runtimeClassName: {{ $.Values.judge.runtimeClass }}
      # Kein Token im Pod. Der eingereichte Code liefe sonst neben
      # /var/run/secrets und könnte den Token lesen, der Worker selbst ruft die
      # Kubernetes-API nie.
      automountServiceAccountToken: false
      # Frist für den geordneten Auslauf nach SIGTERM (#199). Der Worker nimmt
      # nach dem Signal keine Einreichung mehr an und rechnet die laufende
      # Bewertung zu Ende, siehe _sigterm in app/worker/worker.py. Gilt für
      # Rollout, KEDA-Scale-down und Drain, alle drei löschen den Pod über
      # denselben Weg. Die Herleitung des Werts steht in values.yaml.
      terminationGracePeriodSeconds: {{ $.Values.judge.terminationGracePeriodSeconds }}
      # Die Worker verteilen sich über die Judge-Nodes. Ein Worker fordert einen
      # ganzen Kern und läuft ihn bei einer Einreichung auch aus. Liegen mehrere
      # auf einem Node und keiner auf dem anderen, hängt die gemessene Laufzeit
      # einer Einreichung von der Nachbarschaft ab, und genau die Laufzeit
      # bewertet der Judge. Ohne die Regel kann eine Skalierung von KEDA alle
      # neuen Worker auf denselben Node legen, die Verteilung ist beim
      # Scheduler sonst nur eine nachrangige Bewertung.
      #
      # ScheduleAnyway und nicht DoNotSchedule. Ein gedrainter Node zählt weiter
      # als Domain, hart bliebe ein Worker dann Pending statt auf dem übrigen
      # Node zu laufen. Denselben Fall hält #160 für MongoDB fest, dort ist er
      # gewollt, hier nicht. Als harte Platzierungsentscheidung für P4 zählt
      # diese Regel damit nicht, das tun die RuntimeClass und der nodeSelector
      # der Datendienste.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              komponente: judge-worker
      # Setzt die Rechte der beiden emptyDir unten. kubelet legt sie mit 0777
      # ohne Sticky-Bit an, und ohne weiteres Zutun dürfte dort jeder fremde
      # Einträge umbenennen. Für /work heißt das, die Einreichung könnte
      # /work/judge verschieben und jeder weitere Lauf scheiterte am fehlenden
      # Pfad. /tmp bekommt 1777 wie im Image, dort löscht und verschiebt dann
      # nur noch der Eigentümer.
      initContainers:
        - name: verzeichnisse
          # Dasselbe Image wie der Worker, es liegt ohnehin auf dem Node.
          image: {{ include "online-judge.image" (dict "root" $ "repo" .repository) }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          # /tmp bekommt 1777 wie im Image, /work dagegen 0755. Die
          # Arbeitsverzeichnisse unter /work gehören dem Worker, und die
          # Einreichung hat dort nichts anzulegen. Ohne das chmod stünde auch
          # /work auf den 0777 des emptyDir, und sie könnte /work/judge
          # umbenennen, womit jeder weitere Lauf am fehlenden Pfad scheiterte.
          command: ["sh", "-c", "chmod 1777 /tmp && chmod 755 /work"]
          securityContext:
            capabilities:
              drop: ["ALL"]
          # Unter den Werten des Workers. Kubernetes bildet den Request des
          # Pods als Maximum aus Init-Containern und laufenden Containern, mit
          # den Worker-Requests aus den values ändern diese Zahlen ihn also
          # nicht. Wer die Worker-Requests in den values darunter senkt, hebt
          # den Pod-Request auf diese Zahlen an.
          resources:
            requests:
              cpu: "50m"
              memory: "16Mi"
            limits:
              cpu: "100m"
              memory: "32Mi"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: work
              mountPath: /work
      containers:
        - name: worker
          image: {{ include "online-judge.image" (dict "root" $ "repo" .repository) }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          # Als root mit fast leerem Capability-Satz. Root muss sein, der
          # Worker wechselt je Lauf per setuid auf eine eigene UID,
          # runAsNonRoot stoppte ihn schon beim Start. Der Kommentar zu #55
          # nennt CHOWN, SETUID, SETGID und KILL, gemessen (docker run
          # --cap-drop ALL gegen run_code_in_sandbox) reichen die vier seit
          # dem chown und chmod 700 des Arbeitsverzeichnisses nicht mehr:
          # DAC_OVERRIDE braucht der Worker für jeden Blick in das
          # Verzeichnis, sobald es der Einreichung gehört, samt dem rmtree
          # danach, FOWNER für das chmod nach dem chown. Ohne die beiden endet
          # jeder Lauf als Umgebungsfehler und das Arbeitsverzeichnis bleibt
          # liegen.
          securityContext:
            # allowPrivilegeEscalation false setzt NoNewPrivs. Die SUID-Binaries
            # im Image (su, mount) geben der Sandbox dann kein euid 0 mehr, auch
            # nicht über einen Eintrag in einer Datei, die der Worker sonst
            # übergeben hätte. Der setuid-Wechsel des Workers auf die UID des
            # Laufs ist davon nicht betroffen, er senkt Rechte statt sie zu
            # heben. Siehe #185.
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "DAC_OVERRIDE", "FOWNER", "KILL", "SETGID", "SETUID"]
          envFrom:
            - configMapRef:
                name: code-worker-{{ .name }}
          env:
            # Getrennt von der ConfigMap, weil die URI das Passwort enthält.
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.externe.mongoSecrets.worker.name | quote }}
                  key: {{ $.Values.externe.mongoSecrets.worker.key | quote }}
          # Dasselbe Kommando wie die liveness darunter, nach dem Muster des
          # Backends. Bis sie durchläuft, gilt der Container als nicht
          # gestartet, und die liveness ruht so lange. Das Fenster von 60
          # Sekunden deckt den Import von pymongo und redis und den
          # Python-Subprozess, mit dem _netz_trennung_moeglich beim Start prüft,
          # ob die Sandbox ein eigenes Netz bekommt.
          startupProbe:
            exec:
              command: ["sh", "-c", {{ $heartbeat | quote }}]
            periodSeconds: 5
            failureThreshold: 12
          # Fängt allein den Worker, der lebt und nicht mehr arbeitet. Stirbt
          # sein Prozess, startet Kubernetes den Container ohnehin neu, er ist
          # der Hauptprozess des Containers.
          #
          # periodSeconds 30 statt enger, damit die Probe selbst im cgroup nicht
          # ins Gewicht fällt. failureThreshold 2, weil die Frist die Toleranz
          # schon trägt. Der zweite Versuch fängt nur ab, dass die Probe unter
          # Last in ihr eigenes timeoutSeconds läuft. Zusammen vergehen nach dem
          # letzten Fortschritt höchstens die Frist plus 60 Sekunden.
          livenessProbe:
            exec:
              command: ["sh", "-c", {{ $heartbeat | quote }}]
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 2
          resources:
            {{- toYaml .resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: work
              mountPath: /work
      volumes:
        # /tmp mit Deckel. Eine Einreichung darf dort schreiben, je Datei auf
        # 1 MiB begrenzt (RLIMIT_FSIZE), in der Zahl der Dateien aber nicht.
        # sizeLimit deckelt die Summe, kubelet räumt den Pod bei
        # Überschreitung ab und der Ersatz startet mit leerem /tmp. Herleitung
        # der Zahl in README ## Entscheidungen.
        - name: tmp
          emptyDir:
            sizeLimit: {{ $.Values.judge.tmpSizeLimit }}
        # /work trägt die Arbeitsverzeichnisse der Läufe, früher lagen sie unter
        # /tmp (#189). Sie mussten dort heraus, weil jeder Lauf sein eigenes /tmp
        # als tmpfs bekommt und ein tmpfs alles darunter verdeckt. Eigenes
        # Volume mit eigenem Deckel, denn die Einreichung schreibt in ihr
        # Arbeitsverzeichnis, und der Worker räumt es nach dem Lauf.
        - name: work
          emptyDir:
            sizeLimit: {{ $.Values.judge.workSizeLimit }}
---
# minReplicaCount steht auf 0, weil die Last stoßweise ist und zwischen
# Prüfungsterminen nahe null. Ohne Einreichungen soll kein Worker-Pod stehen
# und Ressourcen im gemeinsamen Kursprojekt belegen.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: code-worker-{{ .name }}
  labels:
    {{- include "online-judge.labels" $ | nindent 4 }}
spec:
  scaleTargetRef:
    name: code-worker-{{ .name }}
  minReplicaCount: {{ .keda.min }}
  maxReplicaCount: {{ .keda.max }}
  triggers:
    - type: redis
      metadata:
        address: {{ include "online-judge.redisKedaAdresse" $ | quote }}
        listName: judge:{{ .name }}
        listLength: {{ .keda.listLength | quote }}
        activationListLength: {{ .keda.activationListLength | quote }}
---
{{- end }}
# Nimmt Einreichungen zurück, deren Frist ohne Ergebnis verstrichen ist, siehe
# app/worker/durchlauf.py. Ein CronJob für alle Sprachen, das Skript selbst
# braucht nur MongoDB und Valkey, keine eigene Laufzeitumgebung wie der Worker.
{{- $durchlaufDaten := dict "REDIS_URI" (include "online-judge.redisUri" .) "MAX_VERSUCHE" (.Values.judge.durchlauf.maxVersuche | toString) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: durchlauf
  labels:
    {{- include "online-judge.labels" . | nindent 4 }}
data:
  {{- toYaml $durchlaufDaten | nindent 2 }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: durchlauf
  labels:
    {{- include "online-judge.labels" . | nindent 4 }}
spec:
  # Unter CLAIM_FRIST_PUFFER_SEKUNDEN aus worker.py, sonst liegt eine abgelaufene
  # Einreichung zwischen zwei Läufen unnötig lange. Nicht enger, jeder Lauf
  # fragt MongoDB über alle Sprachen ab.
  schedule: {{ .Values.judge.durchlauf.schedule | quote }}
  # Zwei sich überschneidende Läufe sähen dieselben abgelaufenen Einreichungen.
  # Der bedingte Update in durchlauf.py ließe nur den ersten gewinnen, der
  # zweite liefe für nichts.
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          annotations:
            checksum/config: {{ toYaml $durchlaufDaten | sha256sum }}
          # Ein CronJob vererbt seine Labels nicht ans Pod-Template. Ohne diesen
          # Block trägt der Pod nur die von Kubernetes vergebenen job-name-Label,
          # und die NetworkPolicies für MongoDB und Valkey greifen nicht (#62).
          labels:
            {{- include "online-judge.labels" . | nindent 12 }}
        spec:
          restartPolicy: Never
          # Kein Token im Pod, wie beim Worker. durchlauf.py spricht nur
          # MongoDB und Valkey an, die Kubernetes-API nie.
          automountServiceAccountToken: false
          containers:
            - name: durchlauf
              # Dasselbe Image wie die Worker: durchlauf.py liegt neben
              # worker.py und teilt dessen Abhängigkeiten.
              image: {{ include "online-judge.image" (dict "root" . "repo" .Values.judge.durchlauf.repository) }}
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              # Absoluter Pfad: WORKDIR /app im Image (app/worker/Dockerfile),
              # COPY . . legt durchlauf.py dorthin, neben worker.py.
              command: ["python3", "/app/durchlauf.py"]
              # Anders als der Worker ohne root und ohne jede Capability.
              # durchlauf.py startet keinen fremden Code und wechselt keinen
              # User, es braucht nur die zwei Verbindungen oben. 65534 ist
              # nobody aus dem Image. Die Gruppe 0 muss dazu, /app liegt mit
              # 750 auf root:root (app/worker/Dockerfile), ohne sie scheitert
              # schon das Öffnen von durchlauf.py. Gemessen mit docker run
              # --user 65534:0 --cap-drop ALL gegen MongoDB und Valkey: der
              # Lauf geht durch, als 65534:65534 endet er mit EACCES.
              securityContext:
                runAsNonRoot: true
                runAsUser: 65534
                runAsGroup: 0
                capabilities:
                  drop: ["ALL"]
              envFrom:
                - configMapRef:
                    name: durchlauf
              env:
                # Getrennt von der ConfigMap, weil die URI das Passwort enthält.
                - name: MONGO_URI
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.externe.mongoSecrets.durchlauf.name | quote }}
                      key: {{ .Values.externe.mongoSecrets.durchlauf.key | quote }}
              resources:
                {{- toYaml .Values.judge.durchlauf.resources | nindent 16 }}
