# Vorgaben des Charts. Ein Deployment überlagert sie mit values-dev.yaml oder
# values-prod.yaml; die Unterschiede stehen dort, hier das, was in beiden gilt.
# values.schema.json prüft diese Struktur bei install und upgrade und bricht mit
# klarer Meldung ab, wenn ein Pflichtfeld (Image-Tag) fehlt.
#
# Dieses Chart rollt die API und die Judge-Kette aus. MongoDB, Valkey und der
# Seed der Aufgaben sind Teil der Infrastruktur und stehen schon im Cluster,
# das Chart verbindet sich mit den Datendiensten nur über die Adressen unter
# externe.

# Gemeinsame Herkunft der eigenen Images. Repository und Tag stehen je Dienst
# darunter; latest ist bewusst nicht die Vorgabe, damit nachvollziehbar bleibt,
# welcher Stand läuft (images.yml baut sha- und Versions-Tags).
image:
  registry: ghcr.io/litithio
  # Muss gesetzt sein (Schema). Kein Vorgabewert, damit ein vergessener Tag beim
  # install auffällt statt still auf latest zu fallen.
  tag: ""
  pullPolicy: IfNotPresent

# ---------------------------------------------------------------------------
# Vorhandene Infrastruktur
# ---------------------------------------------------------------------------
# Adressen der Datendienste, die schon im Cluster laufen. Das Chart legt sie
# nicht an, es verbindet sich nur. Vorgabe für die Queue ist der Service-Name im
# selben Namespace; liegt der Dienst woanders, hier den vollen DNS-Namen
# eintragen (z. B. valkey.data.svc.cluster.local).
#
# MongoDB verlangt SCRAM. Die URI samt Zugangsdaten hält der Operator im Secret
# <instanz>-<datenbank>-<benutzer> (ansible/files/mongodb-instance.yaml), das
# Deployment liest sie per secretKeyRef von dort. Eine URI in den values würde
# das Passwort in die Helm-Historie schreiben.
externe:
  mongoSecret:
    name: "mongodb-coding-platform-app"
    key: "connectionString.standard"
  # Herkunftswert des Gateways (#79). Angelegt wird das Secret von
  # ansible/tasks/app.yaml aus auth-credentials.yaml, denselben Wert setzt die
  # Middleware als Header X-Gateway-Auth. Ohne den Wert startet die API nicht.
  gatewaySecret:
    name: "gateway-auth"
    key: "secret"
  redisUri: "redis://valkey:6379"
  # Dieselbe Queue für KEDA, aber als host:port und mit vollem DNS-Namen. Der
  # KEDA-Operator läuft im Namespace keda, ein kurzer Name würde dort aufgelöst
  # und ginge ins Leere.
  redisKedaAdresse: "valkey.judge.svc.cluster.local:6379"
  # ConfigMap mit den Aufgaben-JSONs und laden.py, angelegt von
  # ansible/tasks/seed.yaml. Der Prüflauf unter templates/tests liest daraus
  # die Zuordnung von Lösungsverzeichnis zu Aufgabentitel, eine Kopie der
  # JSONs im Chart wäre eine zweite Wahrheit.
  aufgabenSeedConfigMap: "aufgaben-seed"

# ---------------------------------------------------------------------------
# API (backend)
# ---------------------------------------------------------------------------
backend:
  repository: online-judge-backend
  replicas: 2
  # Der CPU-Request folgt dem Start, nicht der Last. Gemessen sind im Leerlauf
  # 3m und unter Last 8m bis 9m je Pod, beim Start dagegen 54m bis 55m für rund
  # 15 Sekunden, weil main.py beim Start die Indizes anlegt. Läge der Request
  # darunter, würde ausgerechnet der Start gedrosselt und das Fenster der
  # startupProbe liefe langsamer ab.
  #
  # Der Speicher liegt konstant bei 46 MiB, im Leerlauf wie unter Last wie beim
  # Start. Das Limit lässt Luft für größere Antworten, etwa wenn die Oberfläche
  # aus #56 dazukommt.
  resources:
    requests:
      cpu: "100m"
      memory: "64Mi"
    limits:
      cpu: "500m"
      memory: "256Mi"

# ---------------------------------------------------------------------------
# Judge
# ---------------------------------------------------------------------------
# Worker, ScaledObject und Rückhol-CronJob. Der Seed der Aufgaben gehört nicht
# hierher, er braucht laden.py und die Aufgaben-JSONs als ConfigMap und läuft
# deshalb weiter aus Ansible.
judge:
  # Sandbox-Laufzeit der Worker-Pods. Angelegt wird die RuntimeClass in
  # ansible/deploy.yaml, das Chart verweist nur darauf.
  runtimeClass: gvisor

  # Deckel für die Arbeitsverzeichnisse der Läufe unter /work, als sizeLimit an
  # einem emptyDir. Ein Lauf braucht höchstens rund 20 MiB, die Lösung (mehr als
  # 16 MB passen nicht in das Einreichungs-Dokument in MongoDB), die größte
  # Eingabe im Repo mit 372 KB und zwei Ausgabedateien à 1 MiB, und räumt danach
  # auf. 64Mi lässt davon das Dreifache. Herleitung in README ## Entscheidungen.
  workSizeLimit: "64Mi"

  # Deckel für das /tmp des Worker-Pods. Seit #189 bekommt jeder Lauf sein
  # eigenes /tmp als tmpfs, die Einreichung schreibt also nicht mehr hierher.
  # Übrig bleibt, was der Worker-Prozess selbst dort ablegt, und das ist nichts.
  # Der Wert bleibt als Deckel für den Fall, dass doch etwas dort landet.
  tmpSizeLimit: "64Mi"

  # Ab diesem Alter in Sekunden gilt der Heartbeat eines Workers als zu alt
  # und die Liveness-Probe schlägt an. Der Worker schreibt es nach jedem
  # abgeschlossenen Schritt, siehe _heartbeat in app/worker/worker.py.
  #
  # Die längste Lücke zwischen zwei Schritten ist ein Sandbox-Lauf. Er endet
  # nach zeit + 1 + ZEITFRIST_PUFFER, mit zeit höchstens GRENZE_ZEIT_MAX also
  # nach 61,5 Sekunden, dazu REST_FRIST mit 1,0 für das Aufräumen. Das sind
  # 62,5 berechenbare Sekunden. Eine MongoDB-Operation endet seit den
  # Zeitlimits am Client nach 10 Sekunden, mit einem erneuten Versuch über eine
  # Neuwahl des Primary nach 40, und liegt damit darunter.
  #
  # Die 120 lassen 57,5 Sekunden darüber. Der Abstand fängt, was keine eigene
  # Grenze hat, nämlich das Anlegen des Arbeitsverzeichnisses, das chown, das
  # Lesen der Ausgabe und das rmtree. Das sind Zugriffe auf das emptyDir des
  # Pods, kein Netz. Eine Obergrenze ist der Abstand nicht, denn das rmtree
  # läuft ohne Frist. worker.py setzt deshalb vor dem rmtree einen eigenen
  # Heartbeat, damit das Aufräumen mit der vollen Frist beginnt.
  heartbeatFrist: 120

  # Frist in Sekunden zwischen SIGTERM und SIGKILL am Worker-Pod. Der Worker
  # nimmt nach dem SIGTERM keine Einreichung mehr an und rechnet die laufende
  # Bewertung zu Ende (#199). Die Frist muss diese Bewertung decken, sonst
  # beendet SIGKILL den Worker doch mitten im Lauf.
  #
  # Der berechenbare Anteil kommt aus worker.py, gerechnet über den längsten
  # Weg, eine Bewertung, die das Signal knapp überholt und ganz durchläuft.
  # Übernahme, Lesen der Aufgabe und Anlegen der Platzhalter enden nach je
  # höchstens 10 Sekunden (socketTimeoutMS). Je Testfall läuft die Sandbox bis
  # GRENZE_ZEIT_MAX + 1 + ZEITFRIST_PUFFER, also 61,5 Sekunden, danach warten
  # SIGKILL_FRIST mit 5 und REST_FRIST mit 1 auf das Ende der Prozesse, und
  # der Schreibzugriff des Testfall-Ergebnisses endet nach höchstens 10. Das
  # sind 77,5 Sekunden je Testfall. Die Aufgaben im Repo haben höchstens 3
  # Testfälle, dazu 10 Sekunden für das Urteil am Ende. 3 mal 10 + 3 mal 77,5
  # + 10 sind 272,5 Sekunden. Ein wartendes blpop bricht nicht ab und braucht
  # bis zur Flag-Prüfung höchstens QUEUE_WARTEN, also 15 Sekunden, das liegt
  # weit darunter.
  #
  # Die 300 lassen 27,5 Sekunden darüber für das, was keine eigene Grenze hat,
  # die Rüstzeit je Lauf und das rmtree. Zwei Grenzen bleiben. Während einer
  # Primary-Neuwahl von MongoDB kommen je Zugriff bis zu 30 Sekunden
  # Serverauswahl obendrauf, mit dem eingebauten Retry der Treiber auch noch
  # einmal so viel. Ein Zugriff, der endgültig scheitert, bricht die
  # Bewertung aber ab und beendet damit auch den Auslauf. Und die Zahl der
  # Testfälle je Aufgabe deckelt laden.py nicht. Eine Aufgabe mit mehr als 3
  # Testfällen am maximalen Zeitlimit sprengt die Frist, siehe README
  # ## Grenzen.
  terminationGracePeriodSeconds: 300

  # Je Eintrag ein Worker-Deployment und ein ScaledObject. name bildet den
  # Namen des Deployments (code-worker-<name>), den Wert von WORKER_SPRACHE und
  # die Liste judge:<name>, aus der dieser Worker liest. Eine weitere Sprache
  # braucht ein eigenes Image und einen Eintrag hier, keine weitere Datei im
  # Chart. Die API führt daneben ihre eigene Liste, AKTIVE_SPRACHEN in
  # app/backend/main.py, und lehnt eine Sprache ohne Eintrag dort mit 400 ab.
  sprachen:
    - name: python
      repository: online-judge-worker
      # Ein Lauf sättigt einen Kern, gemessen 897m bis 1009m an fünf Pods unter
      # Last. Mehr als ein Kern bringt nichts, der Worker führt die Testfälle
      # nacheinander aus. Request gleich Limit, weil das Zeitlimit einer
      # Aufgabe doppelt gilt, als RLIMIT_CPU auf die Rechenzeit und als Frist
      # auf die vergangene Zeit. Ein gedrosselter Worker reißt die zweite
      # Grenze, ohne die erste zu erreichen, und lässt damit korrekte
      # Einreichungen scheitern.
      #
      # Beim Speicher sind 44 bis 48 MiB gemessen, im Leerlauf wie unter Last.
      # Das Limit
      # deckt zusätzlich den Kindprozess ab, GRENZE_SPEICHER_MAX_MB in
      # worker.py lässt eine Aufgabe bis 256 MB fordern.
      resources:
        requests:
          cpu: "1"
          memory: "64Mi"
        limits:
          cpu: "1"
          memory: "320Mi"
      keda:
        # 0, damit ohne Einreichungen kein Pod steht.
        min: 0
        max: 5
        # Ab dieser Länge je Replica skaliert KEDA hoch.
        listLength: 5
        # KEDA aktiviert, sobald die Länge über diesem Wert liegt. Bei 1 bliebe
        # eine einzelne wartende Einreichung liegen, bis eine zweite dazukommt,
        # und der Rückhol-CronJob holt sie nicht, er greift nur bei RUNNING mit
        # abgelaufener Frist.
        activationListLength: 0

  durchlauf:
    repository: online-judge-worker
    # Dasselbe Image wie der Worker, aber ohne Sandbox. durchlauf.py fragt nur
    # MongoDB und Valkey ab und ist nach wenigen Sekunden fertig. Der Speicher
    # entspricht dem Leerlauf des Workers, gemessen 44 MiB, die CPU-Grenze
    # fängt einen Lauf über viele abgelaufene Einreichungen ab.
    resources:
      requests:
        cpu: "50m"
        memory: "64Mi"
      limits:
        cpu: "500m"
        memory: "128Mi"
    # Unter CLAIM_FRIST_PUFFER_SEKUNDEN aus worker.py, siehe Kommentar im Template.
    schedule: "*/2 * * * *"
    maxVersuche: 3
