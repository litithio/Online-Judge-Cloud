apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        # Feste Version statt latest, damit nachvollziehbar bleibt, welcher
        # Stand im Cluster läuft. Gebaut wird sie von .github/workflows/images.yml
        # bei einem Git-Tag v0.2.3.
        image: ghcr.io/litithio/online-judge-backend:0.2.3
        ports:
        - containerPort: 8000
        env:
        - name: MONGO_URI
          valueFrom:
            secretKeyRef:
              name: mongodb-coding-platform-app
              key: connectionString.standard
        - name: REDIS_URI
          value: "redis://redis:6379"
        - name: KEYCLOAK_URL
          value: "http://keycloak.default.svc.cluster.local:8080"
---
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  selector:
    app: backend
  ports:
  - port: 8000
    targetPort: 8000