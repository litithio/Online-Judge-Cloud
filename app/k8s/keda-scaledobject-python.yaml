# ScaledObject je Sprache (#82), hier für Python, das einzige, das der Worker
# aktuell ausführt (worker.py sandbox ist Python-only). Weitere Sprachen
# bekommen ihr eigenes Deployment plus ihr eigenes ScaledObject, nach
# demselben Schema, sobald ein Worker-Image für sie existiert.
#
# minReplicaCount 0: Die Last ist laut README stoßweise, zwischen
# Prüfungsterminen nahe null. Ohne Einreichungen soll kein Worker-Pod stehen
# und Ressourcen im gemeinsamen Kursprojekt belegen.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: code-worker-python
  namespace: default
spec:
  scaleTargetRef:
    name: code-worker
  minReplicaCount: 0
  maxReplicaCount: 5
  triggers:
    - type: redis
      metadata:
        address: valkey.default.svc.cluster.local:6379
        listName: judge:python
        listLength: "5"
        activationListLength: "0"
