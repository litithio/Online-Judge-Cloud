apiVersion: apps/v1
kind: Deployment
metadata:
  name: code-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: code-worker
  template:
    metadata:
      labels:
        app: code-worker
    spec:
      # Der eingereichte Code läuft als Subprozess im Worker, nicht in einem
      # eigenen Container. Die Isolation kommt deshalb von der Laufzeit des
      # Worker-Pods selbst. runsc liegt auf den Agent-Nodes, die RuntimeClass
      # legt ansible/tasks/gvisor.yaml an.
      runtimeClassName: gvisor
      containers:
      - name: worker
        # Feste Version statt latest, damit nachvollziehbar bleibt, welcher
        # Stand im Cluster läuft. Gebaut wird sie von .github/workflows/images.yml
        # bei einem Git-Tag v0.2.5.
        image: ghcr.io/litithio/online-judge-worker:0.2.5
        env:
        - name: MONGO_URI
          valueFrom:
            secretKeyRef:
              name: mongodb-coding-platform-app
              key: connectionString.standard
        - name: REDIS_URI
          value: "redis://valkey:6379"
        # Bestimmt, welche Liste dieser Worker abfragt (judge:<sprache>, #82)
        # und worauf sein ScaledObject zielt, siehe
        # app/k8s/keda-scaledobject-python.yaml.
        - name: WORKER_SPRACHE
          value: "python"
        # Der eingereichte Code bekommt hier einen eigenen Netz-Namespace, anders
        # als im lokalen Compose-Stand. Ohne diesen Schalter würde die Trennung
        # stillschweigend wegfallen, sobald der Aufruf einmal nicht mehr
        # durchgeht, und Einreichungen erreichten wieder die Datenbank.
        - name: SANDBOX_NETZ_ERZWINGEN
          value: "1"