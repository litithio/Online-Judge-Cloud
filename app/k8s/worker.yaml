apiVersion: apps/v1
kind: Deployment
metadata:
  name: code-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: code-worker
  template:
    metadata:
      labels:
        app: code-worker
    spec:
      # Der eingereichte Code läuft als Subprozess im Worker, nicht in einem
      # eigenen Container. Die Isolation kommt deshalb von der Laufzeit des
      # Worker-Pods selbst. runsc liegt auf den Agent-Nodes, die RuntimeClass
      # legt ansible/tasks/gvisor.yaml an.
      runtimeClassName: gvisor
      containers:
      - name: worker
        # Feste Version statt latest, damit nachvollziehbar bleibt, welcher
        # Stand im Cluster läuft. Gebaut wird sie von .github/workflows/images.yml
        # bei einem Git-Tag v0.2.1.
        image: ghcr.io/litithio/online-judge-worker:0.2.1
        env:
        - name: MONGO_URI
          value: "mongodb://mongodb:27017"
        - name: REDIS_URI
          value: "redis://redis:6379"